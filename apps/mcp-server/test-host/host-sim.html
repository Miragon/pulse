<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SEP-1865 host simulator</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #ffffff;
      }
      body[data-host-theme="dark"] {
        background: #1f1e1d;
      }
      #app {
        display: block;
        width: 960px;
        height: 720px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!-- Strictest sandbox a host can pick: scripts only, opaque origin (no
         storage, no same-origin access). Real hosts add allow-same-origin on
         a separate sandbox origin. A view that works here works there. -->
    <iframe id="app" sandbox="allow-scripts" title="view under test"></iframe>
    <script type="module">
      // Minimal SEP-1865 (MCP Apps) host. It renders the view document the
      // server serves (resources/read → srcdoc, under the CSP built from the
      // resource's _meta.ui.csp), answers the guest's requests, and drives the
      // tool lifecycle the way the scenario asks for:
      //
      //   tool=<name>               the view-bound tool the "model" invoked
      //                             (default: engine_open_cockpit)
      //   args=<json>               its arguments
      //   structuredContent=strip   deliver the result WITHOUT structuredContent
      //                             (claude.ai / Claude Desktop behaviour)
      //   resultDelayMs=<n>         hold the result n ms after `initialized`
      //                             (a slow tool on a compliant host)
      //   cancel                    cancel the call instead of delivering it
      //   theme=light|dark          hostContext.theme
      //   locale=<bcp47>            hostContext.locale (default en-US)
      //   fontSans=<css>            hostContext.styles.variables["--font-sans"]
      //   maxHeight=<px>            hostContext.containerDimensions.maxHeight
      //   displayModes=a,b          hostContext.availableDisplayModes (absent:
      //                             not advertised)
      //   initDelayMs=<n>           answer ui/initialize n ms late (a slow
      //                             handshake)
      //   width=<px>                the frame's width (default 960: the inline
      //                             column a chat gives a view is ~760)
      //   resourceDomains=ignore    build the CSP without the resource's
      //                             resourceDomains (a host that does not
      //                             honour them): the server's font route is
      //                             refused, like any other resource load
      //
      // Every tools/call the VIEW makes is proxied to the real server through
      // the host backend; the spec reads `window.__hostLog`.
      const q = new URLSearchParams(location.search)
      const scenario = {
        tool: q.get("tool") ?? "engine_open_cockpit",
        args: JSON.parse(q.get("args") ?? "{}"),
        strip: q.get("structuredContent") === "strip",
        resultDelayMs: Number(q.get("resultDelayMs") ?? 0),
        cancel: q.has("cancel"),
        theme: q.get("theme") ?? "light",
        locale: q.get("locale") ?? "en-US",
        fontSans: q.get("fontSans"),
        maxHeight: q.has("maxHeight") ? Number(q.get("maxHeight")) : undefined,
        availableDisplayModes: q.has("displayModes") ? q.get("displayModes").split(",") : undefined,
        initDelayMs: Number(q.get("initDelayMs") ?? 0),
        ignoreResourceDomains: q.get("resourceDomains") === "ignore",
        width: q.has("width") ? Number(q.get("width")) : undefined,
      }
      document.body.dataset.hostTheme = scenario.theme
      // A themed page declares its color-scheme; an iframe whose scheme differs
      // from its embedder's gets an opaque UA canvas instead of the host's.
      document.documentElement.style.colorScheme = scenario.theme

      const log = (window.__hostLog = {
        // The view sent ui/initialize (answered `initDelayMs` later).
        initializeRequested: false,
        initialized: false,
        // Date.now() when the view sent `initialized`, the clock `resultDelayMs` runs on.
        initializedAt: null,
        // "result" | "cancelled" once the host finished the rendering call.
        delivered: null,
        // The rendering call's own result as the server returned it.
        originalResult: null,
        // Every tools/call the view made ({ name, arguments }).
        toolCalls: [],
        displayModeRequests: [],
        // Every size report ({ width, height, at }; `at` = Date.now()).
        sizeChanges: [],
        // Every other method the view sent, in order.
        methods: [],
        errors: [],
      })

      const iframe = document.getElementById("app")
      if (scenario.width) iframe.style.width = `${scenario.width}px`
      const post = (msg) => iframe.contentWindow.postMessage(msg, "*")
      // Changes at runtime, as a host does (a resized chat column, another
      // height budget): `setContext` sends host-context-changed, `setWidth`
      // resizes the frame.
      window.__hostSim = {
        setContext: (params) =>
          post({ jsonrpc: "2.0", method: "ui/notifications/host-context-changed", params }),
        setWidth: (px) => {
          iframe.style.width = `${px}px`
        },
      }
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
      let displayMode = "inline"

      async function backendCall(name, args) {
        const res = await fetch("/host/call", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ name, arguments: args }),
        })
        return res.json()
      }

      function cspFor(csp = {}) {
        const list = (key, fallback) => (csp[key] ?? []).join(" ") || fallback
        const resources = scenario.ignoreResourceDomains ? "" : list("resourceDomains", "")
        return [
          "default-src 'none'",
          `script-src 'unsafe-inline' ${resources}`,
          `style-src 'unsafe-inline' ${resources}`,
          `img-src data: blob: ${resources}`,
          `font-src data: ${resources}`,
          `media-src data: blob: ${resources}`,
          `connect-src ${list("connectDomains", "'none'")}`,
          `frame-src ${list("frameDomains", "'none'")}`,
          `base-uri ${list("baseUriDomains", "'none'")}`,
          "object-src 'none'",
        ].join("; ")
      }

      // The "model's" invocation completes before the view mounts, so the
      // result's timing is exactly `resultDelayMs` after `initialized`, never
      // the backend's latency on a loaded CI runner.
      const [originalCall, viewResponse] = await Promise.all([
        backendCall(scenario.tool, scenario.args),
        fetch(`/host/view?tool=${encodeURIComponent(scenario.tool)}`),
      ])
      const view = await viewResponse.json()
      if (!viewResponse.ok) throw new Error(view.error?.message ?? "view read failed")
      const meta = `<meta http-equiv="Content-Security-Policy" content="${cspFor(view.csp)}">`
      // The CSP must open <head>, ahead of every script, or the "nothing is
      // blocked" check runs without one. Refuse a document without a <head>.
      const headOpen = /<head(?:\s[^>]*)?>/i
      if (!headOpen.test(view.html)) {
        const reason = "view document has no <head>: the CSP cannot be injected"
        log.errors.push(reason)
        throw new Error(reason)
      }
      // A replacer function, so the CSP text is never read as a `$` pattern.
      iframe.srcdoc = view.html.replace(headOpen, (head) => `${head}${meta}`)

      async function deliverLifecycle() {
        post({
          jsonrpc: "2.0",
          method: "ui/notifications/tool-input",
          params: { arguments: scenario.args },
        })
        if (scenario.cancel) {
          post({
            jsonrpc: "2.0",
            method: "ui/notifications/tool-cancelled",
            params: { reason: "user action" },
          })
          log.delivered = "cancelled"
          return
        }
        await sleep(scenario.resultDelayMs)
        if (originalCall.error) {
          log.errors.push(`original call: ${originalCall.error.message}`)
          return
        }
        log.originalResult = originalCall.result
        const result = structuredClone(originalCall.result)
        if (scenario.strip) delete result.structuredContent
        post({ jsonrpc: "2.0", method: "ui/notifications/tool-result", params: result })
        log.delivered = "result"
      }

      async function answerToolCall(m) {
        log.toolCalls.push({ name: m.params?.name, arguments: m.params?.arguments ?? {} })
        const outcome = await backendCall(m.params?.name, m.params?.arguments ?? {})
        post(
          outcome.error
            ? { jsonrpc: "2.0", id: m.id, error: { code: -32603, message: outcome.error.message } }
            : { jsonrpc: "2.0", id: m.id, result: outcome.result },
        )
      }

      function answerDisplayMode(m) {
        const mode = m.params?.mode
        log.displayModeRequests.push(mode)
        if ((scenario.availableDisplayModes ?? []).includes(mode)) displayMode = mode
        post({ jsonrpc: "2.0", id: m.id, result: { mode: displayMode } })
        post({
          jsonrpc: "2.0",
          method: "ui/notifications/host-context-changed",
          params: { displayMode },
        })
      }

      function initializeResult(m) {
        return {
          // Echo the guest's version: this host speaks whatever it asks for.
          protocolVersion: m.params?.protocolVersion ?? "2025-11-21",
          hostInfo: { name: "miragon-host-sim", version: "1.0.0" },
          hostCapabilities: {
            serverTools: {},
            openLinks: {},
            logging: {},
            message: { text: {} },
            updateModelContext: { text: {} },
          },
          hostContext: {
            toolInfo: { id: 1, tool: view.tool },
            theme: scenario.theme,
            displayMode,
            ...(scenario.availableDisplayModes && {
              availableDisplayModes: scenario.availableDisplayModes,
            }),
            ...(scenario.fontSans && {
              styles: { variables: { "--font-sans": scenario.fontSans } },
            }),
            ...(scenario.maxHeight !== undefined && {
              containerDimensions: { maxHeight: scenario.maxHeight },
            }),
            locale: scenario.locale,
            platform: "web",
          },
        }
      }

      window.addEventListener("message", (event) => {
        const m = event.data
        if (event.source !== iframe.contentWindow || !m || m.jsonrpc !== "2.0" || !m.method) return
        switch (m.method) {
          case "ui/initialize":
            log.initializeRequested = true
            void sleep(scenario.initDelayMs).then(() =>
              post({ jsonrpc: "2.0", id: m.id, result: initializeResult(m) }),
            )
            return
          case "ui/notifications/initialized":
            log.initialized = true
            log.initializedAt = Date.now()
            void deliverLifecycle()
            return
          case "tools/call":
            void answerToolCall(m)
            return
          case "ui/request-display-mode":
            answerDisplayMode(m)
            return
          case "ui/notifications/size-changed":
            log.sizeChanges.push({ ...m.params, at: Date.now() })
            return
          default:
            log.methods.push(m.method)
            // Any other request (update-model-context, open-link, ping …)
            // gets a generic success so the guest never waits on a timeout.
            if (m.id !== undefined) post({ jsonrpc: "2.0", id: m.id, result: {} })
        }
      })
    </script>
  </body>
</html>
