name: Sync template mirror

# Mirrors templates/composed-server to the standalone template repository
# after a release's npm publish. The monorepo stays the single source of
# truth (release-please bumps the template pins in lockstep); the mirror is a
# read-only convenience so customers get GitHub's "Use this template" button
# and a committed pnpm-lock.yaml (which makes `docker build` work without a
# prior local install). Before pushing, the template is installed and tested
# against the REAL public registry (no tarball overrides) and its Docker image
# is built from that lockfile, the checks scripts/test-template.sh cannot
# perform. Each sync tags the mirror commit with the release tag and publishes
# a release on the mirror, so a starter's owner can watch the mirror's releases
# and diff two versions by tag.
#
# Runs after publish-npm on purpose: syncing on the release merge would
# briefly advertise pins that are not on npm yet.
#
# One-time setup:
#   1. Create the mirror repo (MIRROR_OWNER/MIRROR_NAME below),
#      auto-initialized (any README) so it has a default branch, and mark it
#      as a template repository (Settings → Template repository).
#   2. Grant the release-please GitHub App access to that repo (org Settings
#      → GitHub Apps → Configure → Repository access). The push auth is a
#      short-lived installation token minted from that app (no PAT).
#   3. Bootstrap via workflow_dispatch with the latest release tag.
on:
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to mirror (e.g. v0.4.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to mirror (e.g. v0.4.0)
        required: true
        type: string

permissions:
  contents: read

env:
  MIRROR_OWNER: Miragon
  MIRROR_NAME: pulse-starter

jobs:
  sync:
    name: Test against npm + push mirror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag_name }}

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      # npm's read replicas can lag the publish by a minute or two: a plain
      # install would then resolve a 404 and fail the whole sync. The metadata can
      # arrive before the tarball (0.23.0), so both have to answer. The packages are
      # the libraries the workspace publishes (scripts/workspace-packages.mjs, the
      # predicate the release gate and scripts/test-template.sh read; node built-ins
      # only, so it runs before any install). It is read from the checked-out tag, so a
      # re-sync of a tag cut before the script existed (v0.24.x and older) fails here.
      - name: Wait until the released packages are visible on npm
        env:
          TAG: ${{ inputs.tag_name }}
        run: |
          version="${TAG#v}"
          names="$(node scripts/workspace-packages.mjs libraries | cut -f2)"
          if [ -z "$names" ]; then
            echo "::error::scripts/workspace-packages.mjs listed no library"
            exit 1
          fi
          deadline=$((SECONDS + 600))
          for name in $names; do
            tarball="https://registry.npmjs.org/$name/-/${name#*/}-$version.tgz"
            until npm view "$name@$version" version >/dev/null 2>&1 &&
              curl -sfI "$tarball" >/dev/null; do
              if ((SECONDS >= deadline)); then
                echo "::error::$name@$version not visible on npm after 10 minutes"
                exit 1
              fi
              echo "waiting for $name@$version ..."
              sleep 15
            done
          done

      # Same bar as scripts/test-template.sh, but resolved from the public
      # registry. The generated pnpm-lock.yaml is kept for the mirror commit.
      - name: Install + test the template against the public registry
        run: |
          WORK="$(mktemp -d)/composed-server"
          rsync -a --exclude node_modules --exclude dist --exclude .mcp-use \
            templates/composed-server/ "$WORK/"
          cd "$WORK"
          pnpm install --no-frozen-lockfile
          pnpm build
          pnpm typecheck
          pnpm test
          echo "WORK=$WORK" >> "$GITHUB_ENV"

      # No other job builds the starter's Dockerfile: scripts/test-template.sh has
      # no lockfile in the build context and docker-build.yml builds the root
      # image. $WORK holds the lockfile the mirror commits, and the template's
      # .dockerignore drops the node_modules and dist the step above left there.
      # A Dockerfile that fails here never reaches a new starter.
      - name: Build the template's Docker image
        run: docker build --tag pulse-starter-check "$WORK"

      # Minted right before the push so the 1h token lifetime never races the
      # npm wait + test steps above. Same app as the release train, scoped
      # down to the mirror repo.
      - uses: actions/create-github-app-token@v3.3.0
        id: mirror-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ env.MIRROR_OWNER }}
          repositories: ${{ env.MIRROR_NAME }}

      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.MIRROR_OWNER }}/${{ env.MIRROR_NAME }}
          token: ${{ steps.mirror-token.outputs.token }}
          path: mirror

      # Mirror-only files (lockfile, LICENSE, README banner) are re-created
      # after the --delete pass, so stale copies can never survive a sync.
      # The mirror's own .github/CODEOWNERS is excluded, so --delete keeps it.
      # The banner has two readers: a visitor of the mirror, and the owner of a
      # repository created from it with "Use this template", which copies the
      # banner and CODEOWNERS too.
      - name: Assemble the mirror working tree
        env:
          TAG: ${{ inputs.tag_name }}
        run: |
          rsync -a --delete --exclude .git --exclude /.github/CODEOWNERS templates/composed-server/ mirror/
          cp "$WORK/pnpm-lock.yaml" mirror/pnpm-lock.yaml
          cp LICENSE mirror/LICENSE
          {
            echo "> [!NOTE]"
            echo "> Read-only mirror of [\`templates/composed-server\`](https://github.com/Miragon/pulse/tree/${TAG}/templates/composed-server)"
            echo "> in [Miragon/pulse](https://github.com/Miragon/pulse) at ${TAG}. Open issues and pull requests there."
            echo ">"
            echo "> Created your repository from this template? It does not update itself."
            echo "> Each [release of this mirror](https://github.com/${MIRROR_OWNER}/${MIRROR_NAME}/releases)"
            echo "> names the Pulse release and its changelog. Below 1.0 a release can break your server."
            echo "> Delete this note and \`.github/CODEOWNERS\`, which the mirror keeps for Miragon only."
            echo ""
            cat mirror/README.md
          } > mirror/README.tmp
          mv mirror/README.tmp mirror/README.md

      # Ends early when the tree is already up to date (a rerun, or a release
      # that left the template alone); the tag and release step still runs.
      - name: Commit and push
        env:
          TAG: ${{ inputs.tag_name }}
        run: |
          cd mirror
          git add -A
          if git diff --cached --quiet; then
            echo "Mirror already up to date: nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync from Miragon/pulse ${TAG}"
          git push

      # Tags the commit that holds this release's tree (the sync commit, or the
      # mirror's HEAD when nothing changed) and releases it, so "Watch →
      # Releases" on the mirror notifies. Creates only what is missing, so a
      # rerun never fails on a tag or release that exists, and never moves a
      # published tag. The compare link starts at the newest v-tag below $TAG.
      - name: Tag and release the mirror commit
        env:
          TAG: ${{ inputs.tag_name }}
          GH_TOKEN: ${{ steps.mirror-token.outputs.token }}
        run: |
          cd mirror
          mirror="${MIRROR_OWNER}/${MIRROR_NAME}"
          commit="$(git rev-parse HEAD)"
          # An annotated tag (one made by hand) lists its commit last, as <tag>^{}.
          tagged="$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | tail -n1 | cut -f1)"
          if [ -z "$tagged" ]; then
            git tag "$TAG" "$commit"
            git push origin "refs/tags/${TAG}"
          elif [ "$tagged" != "$commit" ]; then
            echo "::warning::${TAG} already tags ${tagged} on the mirror, not ${commit}: it stays where it is."
          fi

          if out="$(gh release view "$TAG" --repo "$mirror" --json tagName 2>&1)"; then
            echo "Release ${TAG} already exists on ${mirror}."
            exit 0
          elif [ "$out" != "release not found" ]; then
            echo "::error::Could not read release ${TAG} of ${mirror}: ${out}"
            exit 1
          fi

          prev="$(git ls-remote --refs --tags origin |
            awk -v tag="$TAG" '{ sub("^refs/tags/", "", $2) } $2 ~ /^v[0-9]/ && $2 != tag { print $2 } END { print tag }' |
            sort -V | awk -v tag="$TAG" '$0 == tag { print last } { last = $0 }')"
          notes="${RUNNER_TEMP}/mirror-release-notes.md"
          {
            echo "The starter as of [Miragon/pulse ${TAG}](https://github.com/Miragon/pulse/releases/tag/${TAG})."
            echo ""
            echo "- What changed in Pulse: the [release notes](https://github.com/Miragon/pulse/releases/tag/${TAG}) and the [changelog](https://github.com/Miragon/pulse/blob/${TAG}/CHANGELOG.md), which lists every breaking change."
            if [ -n "$prev" ]; then
              echo "- What changed in the starter: [${prev}...${TAG}](https://github.com/${mirror}/compare/${prev}...${TAG})."
            fi
            echo ""
            echo "Pulse is below 1.0.0, so a release can break a server built on this starter. Update all \`@miragon/pulse-*\` packages together, to one exact version."
          } > "$notes"
          gh release create "$TAG" --repo "$mirror" --verify-tag --title "$TAG" --notes-file "$notes"
