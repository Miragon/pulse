name: Publish to Maven Central

on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: "Build & verify only — publish to Maven Local, not Central"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: "Build & verify only — publish to Maven Local, not Central"

permissions:
  contents: read

jobs:
  publish:
    name: Publish engine plugins to Maven Central
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-plugins
    # Sonatype Central Portal token + in-memory GPG signing key, read by the
    # Vanniktech Maven Publish plugin from these standard Gradle project properties.
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MIRAGON_SONATYPE_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MIRAGON_SONATYPE_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Build & Test
        run: ./gradlew build --warning-mode all
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      # publishAndReleaseToMavenCentral uploads the signed bundle to the Central
      # Portal AND auto-releases it (no manual close/release in the Portal UI).
      # --no-configuration-cache: signing/publish tasks are not config-cache safe.
      - name: Publish to Maven Central
        if: ${{ inputs.dry_run != true }}
        run: >-
          ./gradlew --no-configuration-cache -PsignArtifacts=true
          :cibseven-history-metrics:publishAndReleaseToMavenCentral
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Publish to Maven Local (dry run)
        if: ${{ inputs.dry_run == true }}
        run: >-
          ./gradlew --no-configuration-cache
          :cibseven-history-metrics:publishToMavenLocal
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
