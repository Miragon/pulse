name: Publish to GitHub Container Registry

# Pushes the server image to GHCR as ghcr.io/miragon/pulse-server (file name kept:
# release-please.yml calls it). The workflow's own GITHUB_TOKEN logs in, so no
# registry secret exists. Called from the release train, the token holds only
# what the calling job grants: that job must grant packages: write too.

on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: "Build & verify only — do not push"
      version:
        type: string
        default: ""
        description: "Image version (e.g. release-please tag_name `v1.2.0`); falls back to apps/mcp-server-camunda7/package.json"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: "Build & verify only — do not push"
      version:
        type: string
        default: ""
        description: "Image version; falls back to apps/mcp-server-camunda7/package.json"

permissions:
  contents: read
  # No id-token: provenance and SBOM are BuildKit attestations, pushed with the
  # image over the same registry login.
  packages: write # push to ghcr.io with the GITHUB_TOKEN

env:
  IMAGE: ghcr.io/miragon/pulse-server

jobs:
  publish:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Resolve version tag
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"   # release-please tag_name is `v1.2.0` → image tag `1.2.0`
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./apps/mcp-server-camunda7/package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved image version: $VERSION"

      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        if: ${{ inputs.dry_run != true }}
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.dry_run != true }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          # The source label links the GHCR package to Miragon/pulse: the package
          # lists under the repo and shows its README.
          labels: |
            org.opencontainers.image.source=https://github.com/Miragon/pulse
            org.opencontainers.image.title=Pulse
            org.opencontainers.image.description=Pulse MCP server: process operations and analytics for Camunda 7 / CIB seven / Operaton engines
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          # GHCR shows a multi-arch package's description from the index, not from
          # the per-platform labels above.
          annotations: |
            index:org.opencontainers.image.description=Pulse MCP server: process operations and analytics for Camunda 7 / CIB seven / Operaton engines
          provenance: ${{ inputs.dry_run != true }}
          sbom: ${{ inputs.dry_run != true }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
