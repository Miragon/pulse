name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The scopes a PR needs (scripts/ci-scopes.mjs); a push to main runs all.
  changes:
    name: Changes (CI scopes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      typescript: ${{ steps.scopes.outputs.typescript }}
      mcp: ${{ steps.scopes.outputs.mcp }}
      template: ${{ steps.scopes.outputs.template }}
      starter-engine: ${{ steps.scopes.outputs.starter-engine }}
      cli: ${{ steps.scopes.outputs.cli }}
      vscode: ${{ steps.scopes.outputs.vscode }}
      vscode-package: ${{ steps.scopes.outputs.vscode-package }}
      orca: ${{ steps.scopes.outputs.orca }}
      cibseven-example: ${{ steps.scopes.outputs.cibseven-example }}
      brand: ${{ steps.scopes.outputs.brand }}
    steps:
      # Merge commit + base, diffed by the script.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - id: scopes
        run: node scripts/ci-scopes.mjs

  typescript:
    name: TypeScript (Build + Test + Lint)
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Webview suites need Playwright's Chromium shell; cache shared with host-sim.
      - id: playwright
        run: echo "version=$(node -p "require('./packages/core/runtime-view/package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"

      - id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --fail-if-no-match --filter @miragon/pulse-runtime-view exec playwright install --with-deps --only-shell chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --fail-if-no-match --filter @miragon/pulse-runtime-view exec playwright install-deps chromium

      - id: build
        run: pnpm build

      # turbo runs every `generate` before the build, and the npm publish packs what is committed:
      # a committed generated file the build rewrote (c7-client's SDK, c7-core's route tables) is
      # stale and would ship so.
      - name: Generated files are committed fresh
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::pnpm build changed committed files: run pnpm build and commit them"
            exit 1
          fi

      - run: pnpm typecheck

      # Runs on a red typecheck too. node:test reports as spec plus one annotation per failure.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NODE_OPTIONS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=${{ github.workspace }}/scripts/gha-test-reporter.mjs --test-reporter-destination=stdout
        run: pnpm test

  # Playwright host simulation of the built widget bundle (test-host/README.md).
  host-sim:
    name: Widget host simulation (test:host)
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Browser cache keyed on the @playwright/test pin.
      - id: playwright
        run: echo "version=$(node -p "require('./apps/mcp-server/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --fail-if-no-match --filter @miragon/pulse-mcp-server exec playwright install --with-deps --only-shell chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --fail-if-no-match --filter @miragon/pulse-mcp-server exec playwright install-deps chromium

      - run: pnpm --fail-if-no-match --filter @miragon/pulse-mcp-server test:host

      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: host-sim-results
          path: apps/mcp-server/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Real engines in Testcontainers, one leg per flavor; each suite runs in its app's scope.
  engines:
    name: Engines (${{ matrix.flavor }})
    needs: changes
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # cli-engine: the flavor's name in PULSE_CLI_IT_ENGINES.
        include:
          - flavor: cibseven
            image: cibseven/cibseven:run-2.2.0
            cli-engine: cibseven
          - flavor: operaton
            image: operaton/operaton:2.1.5
            cli-engine: operaton
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Matrix and engines.ts must name the same image.
      - name: The CLI suites start the image of this flavor
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if ! grep -qF "image: \"${IMAGE}\"," apps/cli/test/integration/support/engines.ts; then
            echo "::error::apps/cli/test/integration/support/engines.ts does not start ${IMAGE}: bump the matrix and the suites together"
            exit 1
          fi

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: build
        run: pnpm turbo build --filter=@miragon/pulse-cli... --filter=@miragon/pulse-c7-adapter...

      # Every suite runs even after a failure; the operaton leg also tests the packed tarball.
      - name: CLI integration (apps/cli)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.cli == 'true' }}
        env:
          PULSE_CLI_IT_ENGINES: ${{ matrix.cli-engine }}
          PULSE_CLI_IT_SKIP_PACK: ${{ matrix.flavor == 'operaton' && '0' || '1' }}
        run: pnpm --fail-if-no-match --filter @miragon/pulse-cli run test:engines

      - name: Adapter conformance (packages/connectors/c7/c7-adapter)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.vscode == 'true' }}
        env:
          PULSE_ENGINE_IMAGE: ${{ matrix.image }}
        run: pnpm --fail-if-no-match --filter @miragon/pulse-c7-adapter run test:engines

  # The one requirable check of the matrix; skipped passes.
  engines-result:
    name: Engines
    needs: engines
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every leg passed
        env:
          RESULT: ${{ needs.engines.result }}
        run: |
          if [ "$RESULT" != success ] && [ "$RESULT" != skipped ]; then
            echo "::error::The engine matrix ended with ${RESULT}: see the Engines (<flavor>) jobs"
            exit 1
          fi

  # Activation + every command in VS Code stable under Xvfb.
  vscode-smoke:
    name: VS Code smoke
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo build --filter=pulse-cockpit...

      - id: vscode
        name: Current VS Code stable
        shell: bash
        run: |
          version="$(curl -fsSL --retry 3 'https://update.code.visualstudio.com/api/releases/stable?released=true' | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0]')" || version=unknown
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then version=unknown; fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6.1.0
        with:
          path: apps/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ steps.vscode.outputs.version }}

      - run: xvfb-run -a pnpm --fail-if-no-match --filter pulse-cockpit run test:smoke

  # The .vsix a release would ship (MARKETPLACE.md included), checked without uploading.
  vscode-package:
    name: VS Code package (vsce dry run)
    needs: changes
    if: needs.changes.outputs.vscode-package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo build --filter=pulse-cockpit...

      - name: Package
        run: pnpm --fail-if-no-match --filter pulse-cockpit run package --out "$RUNNER_TEMP/pulse.vsix"

      - name: The package ships the bundles and nothing else
        shell: bash
        run: |
          listing="$(unzip -Z1 "$RUNNER_TEMP/pulse.vsix")"
          for file in extension/package.json extension/dist/extension.cjs extension/dist/webview.js extension/dist/webview.css extension/schemas/board.schema.json; do
            if ! grep -qxF "$file" <<<"$listing"; then
              echo "::error::The .vsix lacks ${file}"
              exit 1
            fi
          done
          if grep -E '^extension/(node_modules|src|test)/|\.map$' <<<"$listing"; then
            echo "::error::The .vsix ships sources, tests, source maps or node_modules (listed above)"
            exit 1
          fi
          echo "$listing"

  # Pulse for Orca as Orca loads it: the built plugin folder through the CLI of a pinned Orca
  # release (its .deb, checked against the release's digest, runs on plain Node: no app, no
  # display), and the kit tests on that release's orca/testing. Bump ORCA_VERSION and ORCA_DEB_SHA256 together with apps/orca/types.
  orca:
    name: Orca plugin (validate, check, kit tests)
    needs: changes
    if: needs.changes.outputs.orca == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORCA_VERSION: 1.4.252
      ORCA_DEB_SHA256: f2701cb671ac5ae7cbecb51fd20c0ba17ca4530180237dd9472bd4fcb204d323
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo build --filter=@miragon/pulse-orca...

      - name: Orca CLI ${{ env.ORCA_VERSION }}
        shell: bash
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/orca.deb" \
            "https://github.com/stablyai/orca/releases/download/v${ORCA_VERSION}/orca-ide_${ORCA_VERSION}_amd64.deb"
          echo "${ORCA_DEB_SHA256}  $RUNNER_TEMP/orca.deb" | sha256sum --check --strict
          dpkg-deb -x "$RUNNER_TEMP/orca.deb" "$RUNNER_TEMP/orca"
          echo "ORCA_RESOURCES=$RUNNER_TEMP/orca/opt/Orca/resources" >> "$GITHUB_ENV"

      - run: pnpm --fail-if-no-match --filter @miragon/pulse-orca run test:orca

      # The panel and the worker on Orca's own test kit (orca/testing) of that release.
      - run: pnpm --fail-if-no-match --filter @miragon/pulse-orca run test:kit

  # Every PR: prettier and the build-free repo guards; `pnpm lint` in the typescript scope.
  quality:
    name: Lint + Format
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: The CI scopes were computed
        env:
          RESULT: ${{ needs.changes.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::The changes job ended with ${RESULT}: every scoped job was skipped without running"
            exit 1
          fi

      - uses: actions/checkout@v7.0.1
        with:
          # check-ratchets needs full history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - id: install
        run: pnpm install --frozen-lockfile

      - if: needs.changes.outputs.typescript == 'true'
        run: pnpm lint

      # The checks below run after a red one too, so one run names every failure.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      - name: Repo-wide guards (docs-refs, old-names, pnpm filters)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          NODE_OPTIONS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=${{ github.workspace }}/scripts/gha-test-reporter.mjs --test-reporter-destination=stdout
        run: |
          node --test scripts/docs-refs.test.mjs scripts/old-names.test.mjs
          pnpm lint:package-scripts

      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: Miragon/pin-npm-dependencies@v1.2.2

  template:
    name: Composed-server template (Build + Test)
    needs: changes
    if: needs.changes.outputs.template == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The template against the packed workspace packages.
      - run: ./scripts/test-template.sh

  # The starter's try-out engine on Linux: what a bump of its Run tag can break, and the network
  # path of the starter's container recipe (templates/composed-server/README.md).
  starter-engine:
    name: Starter try-out engine
    needs: changes
    if: needs.changes.outputs.starter-engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: templates/composed-server
    env:
      # The host port compose.yaml publishes on 127.0.0.1, and its project's network.
      PORT: "8410"
      NETWORK: pulse-starter_default
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: docker compose pull

      # The healthcheck gives up after about 150 s.
      - name: The engine turns healthy
        run: docker compose up -d --wait --wait-timeout 240

      # Never a wrong password: one locks demo for seconds, ten for good.
      - name: An anonymous call gets 401, demo/demo 200
        run: |
          rest="http://127.0.0.1:${PORT}/engine-rest"
          anonymous="$(curl -sS -o /dev/null -w '%{http_code}' "$rest/process-definition")"
          demo="$(curl -sS -o /dev/null -w '%{http_code}' -u demo:demo "$rest/process-definition")"
          echo "anonymous: ${anonymous}, demo/demo: ${demo}"
          if [ "$anonymous" != 401 ]; then
            echo "::error::An anonymous call got ${anonymous}, not 401: the REST API lets every request in (CAMUNDA_BPM_RUN_AUTH_* in compose.yaml)"
            exit 1
          fi
          if [ "$demo" != 200 ]; then
            echo "::error::demo/demo got ${demo}, not 200: the login .env.example sends does not pass"
            exit 1
          fi

      # The example deploys after the REST API answers, so the healthcheck can pass before it.
      - name: The invoice example deploys invoice and ReviewInvoice
        run: |
          rest="http://127.0.0.1:${PORT}/engine-rest"
          for _ in $(seq 60); do
            keys="$(curl -sf -u demo:demo "$rest/process-definition?keysIn=invoice,ReviewInvoice&latestVersion=true" | jq -r 'map(.key) | sort | join(",")')" || keys=""
            if [ "$keys" = "ReviewInvoice,invoice" ]; then
              echo "Deployed: ${keys}"
              exit 0
            fi
            sleep 2
          done
          echo "::error::After 2 minutes the engine holds '${keys}', not invoice and ReviewInvoice (CAMUNDA_BPM_RUN_EXAMPLE_ENABLED in compose.yaml)"
          exit 1

      # The container recipe: a container on the project's network reaches the engine by its
      # service name. The engine's image is the client, it ships curl.
      - name: A container on pulse-starter_default reaches http://engine:8080
        run: |
          image="$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q engine)")"
          code="$(docker run --rm --network "$NETWORK" --entrypoint curl "$image" -sS -o /dev/null \
            -w '%{http_code}' --max-time 10 -u demo:demo \
            http://engine:8080/engine-rest/process-definition/key/invoice)" || true
          echo "http://engine:8080 from ${NETWORK}: ${code}"
          if [ "$code" != 200 ]; then
            echo "::error::A container on ${NETWORK} got ${code} from http://engine:8080/engine-rest, not 200: the README's container recipe misses the engine (name: in compose.yaml)"
            exit 1
          fi

      # Why the recipe joins the network: on Linux host-gateway is the Docker bridge's gateway,
      # and the engine's port binds to the host's 127.0.0.1. A record, not a gate.
      - name: host.docker.internal misses the loopback port (the former recipe)
        run: |
          image="$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q engine)")"
          code="$(docker run --rm --add-host=host.docker.internal:host-gateway --entrypoint curl "$image" \
            -sS -o /dev/null -w '%{http_code}' --max-time 10 "http://host.docker.internal:${PORT}/engine-rest/engine")" || true
          echo "http://host.docker.internal:${PORT} through host-gateway: ${code}"
          if [ "$code" != 000 ]; then
            echo "::warning::host.docker.internal reached the port on 127.0.0.1 (HTTP ${code}): the README's reason to join the network no longer holds on this Docker"
          fi

      - name: Engine log
        if: failure()
        run: docker compose logs engine

      - name: Stop the engine
        if: always()
        run: docker compose down -v

  # The copies in .miragon/brand-assets.yaml, unchanged since brand-assets.mjs copied them; every PR.
  brand-assets:
    name: Brand assets (checksums)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: sha256sum -c .miragon/brand-assets.sha256

  # Docs kit vs. Miragon/corporate-identity + brand-lint; skipped without the secret.
  brand:
    name: Brand (CI source + brand-lint)
    needs: changes
    if: needs.changes.outputs.brand == 'true'
    runs-on: ubuntu-latest
    env:
      CI_SOURCE_TOKEN: ${{ secrets.CORPORATE_IDENTITY_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: No access to Miragon/corporate-identity
        if: env.CI_SOURCE_TOKEN == ''
        run: echo "::warning title=Brand checks skipped::CORPORATE_IDENTITY_READ_TOKEN is not set, so the vendored docs kit is not compared with Miragon/corporate-identity and brand-lint does not run. Add the secret (contents:read on Miragon/corporate-identity)."

      # Keep in line with docs/.vitepress/miragon/manifest.json.
      - uses: actions/checkout@v7.0.1
        if: env.CI_SOURCE_TOKEN != ''
        with:
          repository: Miragon/corporate-identity
          ref: v1.10.0
          token: ${{ env.CI_SOURCE_TOKEN }}
          path: .ci-source
          sparse-checkout: plugins/miragon-brand

      - uses: actions/setup-node@v7.1.0
        if: env.CI_SOURCE_TOKEN != ''
        with:
          node-version: 22

      - name: The docs kit equals the CI source
        if: env.CI_SOURCE_TOKEN != ''
        run: node docs/.vitepress/miragon/check.mjs --ci .ci-source

      - name: brand-lint
        if: env.CI_SOURCE_TOKEN != ''
        run: node .ci-source/plugins/miragon-brand/scripts/brand-lint.mjs --nur-hart docs README.md apps/cli/README.md

  cibseven-example:
    name: CIB Seven Example (Build + Test)
    needs: changes
    if: needs.changes.outputs.cibseven-example == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground/cibseven-example
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: ./gradlew build
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

  # CLI single executable per OS; Linux also runs the Operaton suites against it.
  cli-binaries:
    name: CLI binary (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest, file: pulse-cli-linux-x64 }
          - { target: macos-arm64, runner: macos-latest, file: pulse-cli-macos-arm64 }
          - { target: windows-x64, runner: windows-latest, file: pulse-cli-windows-x64.exe }
    defaults:
      run:
        shell: bash
    env:
      FILE: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1

      # Node 24 like the release; no pnpm cache on Linux (partial store would poison the key).
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.x
          check-latest: true
          cache: ${{ runner.os != 'Linux' && 'pnpm' || '' }}
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile --ignore-scripts --fail-if-no-match --filter "@miragon/pulse-cli..."

      - run: pnpm --fail-if-no-match --filter "@miragon/pulse-cli..." run build

      - run: pnpm --fail-if-no-match --filter @miragon/pulse-cli run build:standalone

      - run: pnpm --fail-if-no-match --filter @miragon/pulse-cli run build:exe

      - name: Smoke test the binary
        env:
          # Keeps URL arguments intact in Git Bash; this step only.
          MSYS_NO_PATHCONV: "1"
        working-directory: apps/cli
        run: bash scripts/smoke-test.sh "build/bin/${FILE}"

      - name: Engine suites against the binary
        if: matrix.target == 'linux-x64'
        run: pnpm --fail-if-no-match --filter @miragon/pulse-cli run test:engines
        env:
          PULSE_CLI_IT_BINARY: ${{ github.workspace }}/apps/cli/build/bin/pulse-cli-linux-x64
          PULSE_CLI_IT_ENGINES: operaton
          PULSE_CLI_IT_SKIP_PACK: "1"

      - name: The Homebrew formula renders
        if: matrix.target == 'linux-x64'
        working-directory: apps/cli
        run: |
          for file in pulse-cli-macos-arm64 pulse-cli-macos-x64 pulse-cli-linux-arm64 pulse-cli-linux-x64; do
            printf '%064d  %s.tar.xz\n' 0 "$file"
          done > "$RUNNER_TEMP/pulse-cli-SHA256SUMS"
          bash scripts/homebrew-formula.sh 0.0.0 "$RUNNER_TEMP/pulse-cli-SHA256SUMS" > "$RUNNER_TEMP/pulse-cli.rb"
          ruby -c "$RUNNER_TEMP/pulse-cli.rb"
          grep -F 'bin.install_symlink bin/"pulse-cli" => "pulse"' "$RUNNER_TEMP/pulse-cli.rb"
          grep -F 'shell_output("#{bin}/pulse --version")' "$RUNNER_TEMP/pulse-cli.rb"

  # CLI image for both platforms, no push; smoke test on the runner's platform.
  cli-image:
    name: CLI image (build + smoke)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1

      # No pnpm cache (see cli-binaries).
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile --ignore-scripts --fail-if-no-match --filter "@miragon/pulse-cli..."

      - run: pnpm --fail-if-no-match --filter "@miragon/pulse-cli..." run build

      - run: pnpm --fail-if-no-match --filter @miragon/pulse-cli run build:standalone

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build linux/amd64 and linux/arm64
        uses: docker/build-push-action@v7.4.0
        with:
          context: apps/cli
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Build the image of this platform
        uses: docker/build-push-action@v7.4.0
        with:
          context: apps/cli
          load: true
          tags: pulse-cli:ci

      - name: Smoke test the image
        working-directory: apps/cli
        run: bash scripts/smoke-test.sh docker run --rm -i pulse-cli:ci

      # docker stop must end the CLI with SIGTERM (143), not SIGKILL.
      - name: docker stop ends a waiting command
        run: |
          docker run -d -i --name pulse-cli-signal pulse-cli:ci process-definition list --dry-run \
            --url http://engine.example/engine-rest --auth basic --auth-user demo --auth-password-stdin
          sleep 2
          docker stop -t 10 pulse-cli-signal
          code="$(docker inspect -f '{{.State.ExitCode}}' pulse-cli-signal)"
          docker rm pulse-cli-signal
          if [ "$code" != 143 ]; then
            echo "::error::docker stop ended the CLI with exit code ${code}, expected 143 (SIGTERM)"
            exit 1
          fi

  # Validates the marketplace, the CLI plugin and its skill.
  cli-plugin:
    name: CLI plugin (validate)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: The plugin carries the CLI's version
        run: |
          cli="$(jq -r .version apps/cli/package.json)"
          plugin="$(jq -r .version apps/cli/skills/pulse-cli/.claude-plugin/plugin.json)"
          if [ "$cli" != "$plugin" ]; then
            echo "::error::plugin.json is ${plugin}, apps/cli/package.json is ${cli}"
            exit 1
          fi

      - name: Install Claude Code
        run: npm install --global --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code@stable

      - name: Validate the marketplace, the plugin and its skill
        run: |
          claude --version
          for target in . apps/cli/skills/pulse-cli apps/cli/skills; do
            claude plugin validate --strict "$target"
          done

  # The one requirable check of the CLI jobs; skipped passes.
  cli:
    name: CLI (all checks)
    needs: [cli-binaries, cli-image, cli-plugin]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every CLI job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then
            while IFS= read -r line; do echo "::error::${line}"; done <<<"$failed"
            exit 1
          fi
