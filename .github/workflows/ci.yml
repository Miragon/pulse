name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (Build + Test + Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      # Handed to the `fitness` job, which owns the aggregated report. One
      # glob per package form; their least common ancestor is the repo root,
      # so the artifact keeps the apps/ and packages/ prefixes and unpacks
      # over the checkout as-is. Exact depth, never `**`: upload-artifact
      # follows symlinks, and `**` walks pnpm's workspace links in
      # node_modules and uploads each summary again under every dependent.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-summaries
          path: |
            apps/*/coverage/coverage-summary.json
            packages/core/*/coverage/coverage-summary.json
            packages/connectors/*/*/coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 1

  # The Postgres persistence path (advisory-lock first create, ownership
  # predicate, JSONB encoding, the migration runner, the readiness probe) is
  # executable only against a real database: its suites `describe.skipIf`
  # without TEST_DATABASE_URL and skip in the job above. This job gives them
  # one — same image and credentials as the compose stack's test database
  # (playground/docker/docker-compose.yml + postgres/init.sql), which is what
  # `pnpm test:pg` defaults to locally.
  postgres:
    name: Postgres adapters (test:pg)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_USER: miragon
          POSTGRES_PASSWORD: miragon
          POSTGRES_DB: miragon_test
        ports:
          - 8440:5432
        options: >-
          --health-cmd "pg_isready -U miragon -d miragon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://miragon:miragon@localhost:8440/miragon_test
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The suites import sibling workspace packages through their dist.
      - run: pnpm build

      - run: pnpm test:pg

  # Playwright host simulation of the BUILT widget bundle
  # (apps/mcp-server-camunda7/test-host/README.md): the view document the real
  # server serves, rendered in a sandboxed iframe behind a SEP-1865 host shim —
  # the only check that runs the bundle's provider stack, the vite `dedupe`
  # and the view recovery lifecycle in a browser. Not path-filtered: the
  # bundle is assembled from every package plus the toolkit and mcp-use pins.
  host-sim:
    name: Widget host simulation (test:host)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The global setup boots `createApp` against the workspace packages' dist.
      - run: pnpm build

      # Browser cache keyed on the exact @playwright/test pin, which decides
      # the browser build; system libraries are not cacheable and are
      # installed on every run.
      - id: playwright
        run: echo "version=$(node -p "require('./apps/mcp-server-camunda7/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --fail-if-no-match --filter @miragon/pulse-mcp-server-camunda7 exec playwright install --with-deps --only-shell chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --fail-if-no-match --filter @miragon/pulse-mcp-server-camunda7 exec playwright install-deps chromium

      - run: pnpm --fail-if-no-match --filter @miragon/pulse-mcp-server-camunda7 test:host

      # Traces + failure screenshots of the failed scenarios.
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: host-sim-results
          path: apps/mcp-server-camunda7/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Real engines in Testcontainers on the runner's Docker, one leg per flavor (Camunda 7, CIB
  # seven, Operaton: the server's flavor values, the default first). Each leg runs every suite
  # that needs a real engine, so far the CLI's (apps/cli test:engines; its OAuth and bearer
  # suites put Keycloak and Envoy in front). Node 22, the floor of the CLI's npm package; the CLI
  # binary leg below runs the Operaton suites on Node 24. Not path-filtered, like every job here:
  # a skipped leg would hide a broken shared input (lockfile, tsconfig.base.json,
  # vitest.shared.ts). Each leg reports a check of its own; the "Engines" job below is the one
  # check a ruleset can require.
  engines:
    name: Engines (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    # Image pulls, engine starts (a suite allows 4 min for one) and the suites: a CLI leg took
    # about 4 min in its own repository.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # image: the engine image of the flavor. cli-engine: its name in the CLI's suites
        # (PULSE_CLI_IT_ENGINES).
        include:
          - flavor: camunda7
            image: camunda/camunda-bpm-platform:run-7.24.0
            cli-engine: camunda
          - flavor: cibseven
            image: cibseven/cibseven:run-2.2.0
            cli-engine: cibseven
          - flavor: operaton
            image: operaton/operaton:2.1.5
            cli-engine: operaton
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The CLI's suites pin their images in engines.ts, and Dependabot tracks neither copy: a
      # bump changes both, or this leg would claim an engine it never started.
      - name: The CLI suites start the image of this flavor
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if ! grep -qF "image: \"${IMAGE}\"," apps/cli/test/integration/support/engines.ts; then
            echo "::error::apps/cli/test/integration/support/engines.ts does not start ${IMAGE}: bump the matrix and the suites together"
            exit 1
          fi

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The suites run what CI built: the CLI's dist/pulse-cli.js and its workspace dependencies.
      - id: build
        run: pnpm turbo build --filter=@miragon/pulse-cli...

      # Each suite runs even when an earlier one failed, so a red leg names every failing suite.
      # The packed-tarball test (pnpm pack, npm install -g into a temporary prefix, run the
      # installed bin) does not depend on the engine: the operaton leg runs it.
      - name: CLI integration (apps/cli)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PULSE_CLI_IT_ENGINES: ${{ matrix.cli-engine }}
          PULSE_CLI_IT_SKIP_PACK: ${{ matrix.flavor == 'operaton' && '0' || '1' }}
        run: pnpm --fail-if-no-match --filter @miragon/pulse-cli run test:engines

  # The one check of the engine matrix a ruleset can require: each leg reports under its own
  # name, and scripts/check-github-config.mjs refuses a required matrix job.
  engines-result:
    name: Engines
    needs: engines
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every leg passed
        env:
          RESULT: ${{ needs.engines.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::The engine matrix ended with ${RESULT}: see the Engines (<flavor>) jobs"
            exit 1
          fi

  quality:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history: `pnpm lint` runs scripts/check-ratchets.mjs, which
          # diffs every ratchet against the merge base with the PR base (and
          # reads the branch's commit trailers) — it refuses a shallow clone.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - uses: Miragon/pin-npm-dependencies@v1.2.2

  # The diff gate: Stryker over the files the PR changed. The full run per
  # package is the nightly .github/workflows/mutation-nightly.yml (no
  # required check).
  mutation:
    name: Mutation (changed files)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A bound for the whole job, not one package: mutation-diff.mjs runs the
    # packages one after another, and FILE_CAP (25 files) caps each package on
    # its own. At the slowest measured rate (widget-shell, about 1 min/file)
    # one package at the cap takes about 25 min, so 120 min hold about four
    # packages at the cap next to install and build; the longest run so far
    # took 10 min, and GitHub's default would be 360. A run that hits it fails
    # the required check: split the PR (the Mutation-Cap-Exception trailer does
    # not apply to a timeout).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # mutation-diff.mjs diffs against the merge-base with the PR base.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cross-package imports in the suites resolve via each package's dist.
      - run: pnpm build

      - run: node scripts/mutation-diff.mjs origin/${{ github.base_ref }}

      # One glob per package form a stryker.config.json can sit in. Their
      # least common ancestor is the repo root, so the artifact keeps the
      # prefixes and the fitness job unpacks it over the checkout as-is.
      # Exact depth, never `**`: upload-artifact follows symlinks, and `**`
      # walks pnpm's workspace links in node_modules and uploads each report
      # again under every dependent. Uploaded even on a red gate so the report
      # still shows the score that failed.
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mutation-reports
          path: |
            apps/*/reports/mutation-report.json
            packages/core/*/reports/mutation-report.json
            packages/connectors/*/*/reports/mutation-report.json
          if-no-files-found: ignore
          retention-days: 1

  # Aggregated fitness report (architecture, ratchet debt, coverage, mutation
  # scores) → job summary. Separate job because coverage and mutation scores
  # are produced by two different jobs; it consumes both as artifacts.
  fitness:
    name: Fitness report
    needs: [typescript, mutation]
    # `!cancelled()` rather than `always()`: the report should still run when
    # the mutation gate went red or was skipped, but not after a cancelled run
    # — pushing to a PR branch cancels the previous one (see `concurrency`),
    # and `always()` would spend a runner on install + build for it anyway.
    if: ${{ !cancelled() && needs.typescript.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # depcruise resolves workspace imports through each package's dist; an
      # unbuilt tree would report "0 violations" it never actually measured.
      - run: pnpm build

      - uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-summaries

      # Optional: no artifact exists on push-to-main (the mutation job does not
      # run) nor when the diff touched nothing inside a `mutate` allowlist. The
      # report degrades to "(no run)" in those cases instead of failing.
      # Rooted at the repo, like coverage-summaries: the artifact carries the
      # apps/ and packages/ prefixes.
      - if: needs.mutation.result == 'success' || needs.mutation.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: mutation-reports

      - run: pnpm fitness

  template:
    name: Composed-server template (Build + Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Packs the workspace packages and runs the template against the
      # tarballs — the gate that templates/composed-server keeps compiling
      # against what the release train will publish.
      - run: ./scripts/test-template.sh

  # The Miragon brand against its source, the private Miragon/corporate-identity:
  # the docs kit vendored in docs/.vitepress/miragon/ equals the release pinned
  # below, and brand-lint finds no hard violation in the docs, the README and the
  # CLI's README, which npm shows (rules and exceptions in .miragon/brand.json). Without the secret (not set up
  # yet, or a fork PR) the job warns and skips; the kit's own manifest check
  # still runs in `pnpm test` and in docs.yml.
  brand:
    name: Brand (CI source + brand-lint)
    runs-on: ubuntu-latest
    env:
      CI_SOURCE_TOKEN: ${{ secrets.CORPORATE_IDENTITY_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: No access to Miragon/corporate-identity
        if: env.CI_SOURCE_TOKEN == ''
        run: echo "::warning title=Brand checks skipped::CORPORATE_IDENTITY_READ_TOKEN is not set, so the vendored docs kit is not compared with Miragon/corporate-identity and brand-lint does not run. Add the secret (contents:read on Miragon/corporate-identity)."

      # Keep ref on the release in docs/.vitepress/miragon/manifest.json.
      - uses: actions/checkout@v7.0.1
        if: env.CI_SOURCE_TOKEN != ''
        with:
          repository: Miragon/corporate-identity
          ref: v1.10.0
          token: ${{ env.CI_SOURCE_TOKEN }}
          path: .ci-source
          sparse-checkout: plugins/miragon-brand

      - uses: actions/setup-node@v7.1.0
        if: env.CI_SOURCE_TOKEN != ''
        with:
          node-version: 22

      - name: The docs kit equals the CI source
        if: env.CI_SOURCE_TOKEN != ''
        run: node docs/.vitepress/miragon/check.mjs --ci .ci-source

      - name: brand-lint
        if: env.CI_SOURCE_TOKEN != ''
        run: node .ci-source/plugins/miragon-brand/scripts/brand-lint.mjs --nur-hart docs README.md apps/cli/README.md

  kotlin:
    name: Kotlin (Build + Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-plugins
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: ./gradlew build
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

  cibseven-example:
    name: CIB Seven Example (Build + Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground/cibseven-example
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: ./gradlew build
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

  # The CLI's standalone executable: the standalone bundle injected into Node.js 24 as a single
  # executable application (apps/cli/scripts/build-exe.ts), built and smoke-tested on one native
  # runner per operating system; the release builds all five targets. Linux also runs the
  # Operaton suites against the binary, so a bundling or SEA defect (module loading, fetch, stdin,
  # the loopback server) fails here and not after a release. The CLI's suites on Node 22 run in
  # the engine matrix above.
  cli-binaries:
    name: CLI binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest, file: pulse-cli-linux-x64 }
          - { target: macos-arm64, runner: macos-latest, file: pulse-cli-macos-arm64 }
          - { target: windows-x64, runner: windows-latest, file: pulse-cli-windows-x64.exe }
    defaults:
      run:
        shell: bash
    env:
      FILE: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.0

      # The binary embeds this Node.js: the newest 24.x, like the release. setup-node keys the pnpm
      # store by OS and lockfile only, so on Linux this filtered install would save a partial
      # store under the key the full installs of the other jobs restore; macOS and Windows have
      # their own keys and keep the cache.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.x
          check-latest: true
          cache: ${{ runner.os != 'Linux' && 'pnpm' || '' }}
          package-manager-cache: false

      # The root and the CLI with its workspace dependencies only: no other package installs
      # (or fails to install) on macOS and Windows.
      - run: pnpm install --frozen-lockfile --ignore-scripts --fail-if-no-match --filter "@miragon/pulse-cli..."

      - run: pnpm --fail-if-no-match --filter "@miragon/pulse-cli..." run build

      - run: pnpm --fail-if-no-match --filter @miragon/pulse-cli run build:standalone

      - run: pnpm --fail-if-no-match --filter @miragon/pulse-cli run build:exe

      - name: Smoke test the binary
        env:
          # Git Bash on Windows passes the smoke test's URL arguments unchanged. Only this
          # step: on the whole job it breaks pnpm's own shim (a /c/... path read as D:\c\...).
          MSYS_NO_PATHCONV: "1"
        working-directory: apps/cli
        run: bash scripts/smoke-test.sh "build/bin/${FILE}"

      # Homebrew installs operate, the command's released name, as a symlink to pulse-cli
      # (apps/cli/scripts/homebrew-formula.sh) until the first release after 2027-01-31: the binary
      # started under that name runs and warns on stderr.
      - name: The binary started as operate
        if: runner.os != 'Windows'
        working-directory: apps/cli
        run: |
          ln -s "$PWD/build/bin/${FILE}" "$RUNNER_TEMP/operate"
          version="$("$RUNNER_TEMP/operate" --version 2>"$RUNNER_TEMP/operate.err")"
          cat "$RUNNER_TEMP/operate.err"
          if [ "$version" != "$(jq -r .version package.json)" ]; then
            echo "::error::operate --version printed ${version}"
            exit 1
          fi
          if ! grep -q "first release after 2027-01-31" "$RUNNER_TEMP/operate.err"; then
            echo "::error::operate --version did not warn that the name goes away"
            exit 1
          fi

      - name: Engine suites against the binary
        if: matrix.target == 'linux-x64'
        run: pnpm --fail-if-no-match --filter @miragon/pulse-cli run test:engines
        env:
          PULSE_CLI_IT_BINARY: ${{ github.workspace }}/apps/cli/build/bin/pulse-cli-linux-x64
          PULSE_CLI_IT_ENGINES: operaton
          PULSE_CLI_IT_SKIP_PACK: "1"

      # The release writes the Homebrew formula with this script: it renders to valid Ruby.
      - name: The Homebrew formula renders
        if: matrix.target == 'linux-x64'
        working-directory: apps/cli
        run: |
          for file in pulse-cli-macos-arm64 pulse-cli-macos-x64 pulse-cli-linux-arm64 pulse-cli-linux-x64; do
            printf '%064d  %s.tar.xz\n' 0 "$file"
          done > "$RUNNER_TEMP/pulse-cli-SHA256SUMS"
          bash scripts/homebrew-formula.sh 0.0.0 "$RUNNER_TEMP/pulse-cli-SHA256SUMS" > "$RUNNER_TEMP/pulse-cli.rb"
          ruby -c "$RUNNER_TEMP/pulse-cli.rb"

  # The CLI image (apps/cli/Dockerfile: the standalone bundle on distroless Node.js 24) for both
  # platforms, without pushing; the smoke test runs the image of the runner's platform.
  cli-image:
    name: CLI image (build + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.0

      # No pnpm cache: this filtered install would save a partial store under the key the full
      # installs of the other Linux jobs restore (see cli-binaries).
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile --ignore-scripts --fail-if-no-match --filter "@miragon/pulse-cli..."

      - run: pnpm --fail-if-no-match --filter "@miragon/pulse-cli..." run build

      - run: pnpm --fail-if-no-match --filter @miragon/pulse-cli run build:standalone

      - uses: docker/setup-buildx-action@v4.4.1

      # Only COPY instructions, so neither platform needs emulation.
      - name: Build linux/amd64 and linux/arm64
        uses: docker/build-push-action@v7.4.0
        with:
          context: apps/cli
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Build the image of this platform
        uses: docker/build-push-action@v7.4.0
        with:
          context: apps/cli
          load: true
          tags: pulse-cli:ci

      - name: Smoke test the image
        working-directory: apps/cli
        run: bash scripts/smoke-test.sh docker run --rm -i pulse-cli:ci

      # node is PID 1 in the container: without the CLI's own handler the kernel drops SIGTERM
      # and SIGINT, and docker stop would need SIGKILL after the timeout (exit 137).
      - name: docker stop ends a waiting command
        run: |
          docker run -d -i --name pulse-cli-signal pulse-cli:ci process-definition list --dry-run \
            --url http://engine.example/engine-rest --auth basic --auth-user demo --auth-password-stdin
          sleep 2
          docker stop -t 10 pulse-cli-signal
          code="$(docker inspect -f '{{.State.ExitCode}}' pulse-cli-signal)"
          docker rm pulse-cli-signal
          if [ "$code" != 143 ]; then
            echo "::error::docker stop ended the CLI with exit code ${code}, expected 143 (SIGTERM)"
            exit 1
          fi

  # The Claude Code plugin of the CLI: the plugin in apps/cli/skills/pulse-cli (manifest and
  # command) and its skill, validated as part of apps/cli/skills, since a plugin run skips a
  # SKILL.md at the plugin root. The repository has no marketplace of its own: the family
  # marketplace Miragon/skills lists the plugin. `claude plugin validate` needs no account or API
  # key; the stable channel is typically a week old and skips releases with major regressions.
  cli-plugin:
    name: CLI plugin (validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false

      # release-please bumps both (release-please-config.json extra-files): they never differ.
      - name: The plugin carries the CLI's version
        run: |
          cli="$(jq -r .version apps/cli/package.json)"
          plugin="$(jq -r .version apps/cli/skills/pulse-cli/.claude-plugin/plugin.json)"
          if [ "$cli" != "$plugin" ]; then
            echo "::error::plugin.json is ${plugin}, apps/cli/package.json is ${cli}"
            exit 1
          fi

      # The postinstall script of the package puts the native binary in place.
      - name: Install Claude Code
        run: npm install --global --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code@stable

      - name: Validate the plugin and its skill
        run: |
          claude --version
          for target in apps/cli/skills/pulse-cli apps/cli/skills; do
            claude plugin validate --strict "$target"
          done

  # One check for the CLI's own jobs above, the name a ruleset can require: a matrix reports one
  # check per leg under another name (scripts/check-github-config.mjs refuses a required matrix
  # job). The CLI's engine suites report under "Engines". Fails when any of them did not succeed.
  cli:
    name: CLI (all checks)
    needs: [cli-binaries, cli-image, cli-plugin]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every CLI job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then
            while IFS= read -r line; do echo "::error::${line}"; done <<<"$failed"
            exit 1
          fi
