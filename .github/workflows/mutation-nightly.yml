name: Mutation (nightly)

# The FULL Stryker run, one leg per workspace package with a stryker.config.json, over the
# package's whole `mutate` allowlist, and the only mutation testing CI runs (owner decision): no
# pull request runs Stryker, and this run is no required check. A red leg means the package
# scores below its thresholds.break.
#
# Each leg keeps its package's Stryker incremental file in the Actions cache (every
# stryker.config.json sets incremental: true and incrementalFile reports/stryker-incremental.json,
# pinned). A night re-tests only the mutants whose own code or tests changed and reuses every
# other result, also where a helper, another package's dist or a dependency changed what a test
# asserts: such a result can be stale until the package starts cold. No scheduled run forces a
# full pass (owner decision: incremental nightly only); a dispatch with `force` re-tests every
# mutant. The cache key fingerprints the lockfile, the vitest, tsconfig and Stryker config and
# the Node major, so a change there starts the package cold.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Ignore the incremental cache and run every mutant
        type: boolean
        default: false

concurrency:
  group: mutation-nightly
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  packages:
    name: List mutation packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Every package form of pnpm-workspace.yaml (its wildcard globs) at its exact depth: list a
      # new form here. The slug names the leg's cache and artifact, which cannot carry a slash.
      - id: list
        name: List
        run: |
          dirs=()
          for dir in apps/* packages/core/* packages/connectors/*/*; do
            if [ -f "${dir}/stryker.config.json" ]; then dirs+=("$dir"); fi
          done
          node -e 'console.log("packages=" + JSON.stringify(process.argv.slice(1).map((dir) => ({ dir, slug: dir.split("/").join("-") }))))' "${dirs[@]}" >> "$GITHUB_OUTPUT"

  mutation:
    name: Mutation (${{ matrix.dir }})
    needs: packages
    if: ${{ needs.packages.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    # A cold or forced run of a package mutates its whole allowlist (widget-shell: about 70 files
    # at about 1 min/file; the CLI: 135 files, about 240 min at Stryker's 4 workers, measured as
    # the sum of the four shards of its last full run in its own repository); the other nights
    # re-run only what changed. GitHub ends a hosted job after 360 min.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cross-package imports in the suites resolve via each package's dist.
      - run: pnpm build

      # The key prefix: the package, the Node major and a fingerprint of what Stryker's own diff
      # never looks at (the lockfile, the shared and the package's vitest, tsconfig and Stryker
      # config). A change there restores nothing, and the leg runs cold.
      - id: cache-key
        name: Cache key
        env:
          SLUG: ${{ matrix.slug }}
          FINGERPRINT: ${{ hashFiles('pnpm-lock.yaml', 'vitest.shared.ts', 'tsconfig.base.json', format('{0}/stryker.config.json', matrix.dir), format('{0}/vitest*.ts', matrix.dir), format('{0}/tsconfig*.json', matrix.dir)) }}
        run: |
          if [ -z "$FINGERPRINT" ]; then
            echo "::error::The cache fingerprint is empty: hashFiles matched no file"
            exit 1
          fi
          node_major="$(node -p 'process.versions.node.split(".")[0]')"
          echo "prefix=stryker-incremental-${SLUG}-node${node_major}-${FINGERPRINT}-" >> "$GITHUB_OUTPUT"

      # The newest incremental file under that prefix; every run saves its own under a new key.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ matrix.dir }}/reports/stryker-incremental.json
          key: ${{ steps.cache-key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}

      - name: Stryker
        env:
          DIR: ${{ matrix.dir }}
          FORCE: ${{ inputs.force == true }}
        run: |
          args=()
          if [ "$FORCE" = true ]; then args+=(--force); fi
          pnpm --fail-if-no-match --filter "./${DIR}" exec stryker run "${args[@]}"

      # Saved after a red leg too: Stryker writes the file before it checks thresholds.break, and
      # the next night then starts from it.
      - if: ${{ !cancelled() }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ matrix.dir }}/reports/stryker-incremental.json
          key: ${{ steps.cache-key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}

      # One exact-depth glob per package form, as for ci.yml's coverage-summaries: their least
      # common ancestor is the repo root, so the report keeps its package prefix and the summary
      # job unpacks every leg's over the checkout.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mutation-report-${{ matrix.slug }}
          path: |
            apps/*/reports/mutation-report.json
            packages/core/*/reports/mutation-report.json
            packages/connectors/*/*/reports/mutation-report.json
          if-no-files-found: warn
          retention-days: 14

  summary:
    name: Mutation summary
    needs: [packages, mutation]
    if: ${{ !cancelled() && needs.packages.result == 'success' && needs.packages.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # depcruise (the report's architecture line) resolves workspace imports through dist.
      - run: pnpm build

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: mutation-report-*
          merge-multiple: true

      # The scores and the file count each covers, into the job summary (no coverage here).
      - run: pnpm fitness
