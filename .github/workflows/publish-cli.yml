name: Publish the CLI

# Reusable workflow, called by release-please.yml after the release gate: the channels of
# @miragon/pulse-cli besides npm (the publish-npm matrix packs and publishes apps/cli like every
# other package). One standalone bundle (apps/cli/tsdown.standalone.config.ts: one CommonJS file,
# every runtime dependency inlined) feeds
#   binaries  five Node.js single executable applications, each built and smoke-tested on its
#             native runner (the V8 code cache is valid only on the platform that built it), the
#             macOS and Linux ones also as <file>.tar.xz holding an executable pulse-cli and the
#             licences (LICENSE, THIRD_PARTY_LICENSES.txt, NODE_LICENSE);
#   licences  the same three files as pulse-cli-LICENSE, pulse-cli-THIRD_PARTY_LICENSES.txt and
#             pulse-cli-NODE_LICENSE, for the Windows executable and the raw ones: one Node.js
#             licence, which the five share (each takes the newest 24.x when it builds), and the job
#             fails when their licence texts differ (apps/cli/scripts/release-licenses.sh);
#   assets    the binaries, the archives, the licences and pulse-cli-SHA256SUMS on the GitHub
#             release of the tag, with a build provenance attestation
#             (gh attestation verify <file> --repo Miragon/pulse); a re-run replaces them;
#   image     ghcr.io/miragon/pulse-cli (apps/cli/Dockerfile: distroless Node.js 24, non-root,
#             the licences in /usr/share/doc/pulse-cli, linux/amd64 and linux/arm64), tagged
#             <version>, <major>.<minor> and latest (a prerelease only <version>), with SBOM,
#             provenance and an attestation
#             (gh attestation verify oci://ghcr.io/miragon/pulse-cli:<version> --repo Miragon/pulse).
# A dry run builds and smoke-tests everything and publishes nothing. The jobs that install and
# build hold contents: read only; the jobs that hold a token (release upload, attestation,
# registry push) install nothing and run no package manager. No dependency cache in a release
# job. Everything builds from the commit of this run, like the npm tarballs of the same release.
# scripts/check-github-config.mjs (`pnpm lint:github`) pins that shape.
on:
  workflow_call:
    inputs:
      version:
        description: Release version without the v prefix (release-please's version output; empty on a dry run)
        required: true
        type: string
      dry_run:
        description: Build and smoke-test only, publish nothing
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  bundle:
    name: CLI bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false

      # The CLI prints the version of apps/cli/package.json (inlined at build time), so the
      # release must have bumped it (release-please-config.json extra-files).
      - id: version
        name: Resolve version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          manifest="$(node -p 'require("./apps/cli/package.json").version')"
          if [ -z "$VERSION" ]; then VERSION="$manifest"; fi
          if [ "$manifest" != "$VERSION" ]; then
            echo "::error::apps/cli/package.json is ${manifest}, the release is ${VERSION}: is it in release-please-config.json extra-files?"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # The provenance of every artifact names this run's commit; the tag can point elsewhere
      # when a later push or a manual run created the release.
      - name: Compare the tag with this commit
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          tagged="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::warning::${TAG} points to ${tagged}, this run builds ${GITHUB_SHA}"
          fi

      - run: pnpm install --frozen-lockfile --ignore-scripts --fail-if-no-match --filter "@miragon/pulse-cli..."

      - run: pnpm --fail-if-no-match --filter "@miragon/pulse-cli..." run build

      - run: pnpm --fail-if-no-match --filter @miragon/pulse-cli run build:standalone

      - name: Smoke test the standalone bundle
        working-directory: apps/cli
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/smoke-test.sh node build/standalone/pulse-cli.cjs

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cli-standalone
          path: apps/cli/build/standalone/pulse-cli.cjs
          if-no-files-found: error
          retention-days: 7

  binaries:
    name: CLI binary ${{ matrix.target }}
    needs: bundle
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest, file: pulse-cli-linux-x64 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, file: pulse-cli-linux-arm64 }
          - { target: macos-x64, runner: macos-26-intel, file: pulse-cli-macos-x64 }
          - { target: macos-arm64, runner: macos-latest, file: pulse-cli-macos-arm64 }
          - { target: windows-x64, runner: windows-latest, file: pulse-cli-windows-x64.exe }
    env:
      EXPECTED_VERSION: ${{ needs.bundle.outputs.version }}
      FILE: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1

      # The binary embeds this Node.js: the newest 24.x when the job runs (security fixes), the same
      # on every runner unless Node.js releases during the run (the licences job fails when that
      # release changed the licence text).
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.x
          check-latest: true
          package-manager-cache: false

      # build:exe needs tsx and postject only, neither runs an install script.
      - run: pnpm install --frozen-lockfile --ignore-scripts --fail-if-no-match --filter @miragon/pulse-cli

      - uses: actions/download-artifact@v8.0.2
        with:
          name: cli-standalone
          path: apps/cli/build/standalone

      - run: pnpm --fail-if-no-match --filter @miragon/pulse-cli run build:exe

      - name: Smoke test the binary
        env:
          # Git Bash on Windows passes the smoke test's URL arguments unchanged. Only this
          # step: on the whole job it breaks pnpm's own shim (a /c/... path read as D:\c\...).
          MSYS_NO_PATHCONV: "1"
        working-directory: apps/cli
        run: bash scripts/smoke-test.sh "build/bin/${FILE}"

      # The macOS and Linux binaries also as <file>.tar.xz, a fifth of the download, which the
      # Homebrew formula takes: the executable pulse-cli beside LICENSE, THIRD_PARTY_LICENSES.txt
      # and NODE_LICENSE, the licence of the Node.js it embeds (scripts/pack-binary.sh, which
      # ci.yml runs too). GNU tar passes XZ_OPT to xz.
      - name: Pack the binary
        if: runner.os != 'Windows'
        working-directory: apps/cli
        env:
          XZ_OPT: -T0
        run: bash scripts/pack-binary.sh "build/bin/${FILE}"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cli-binary-${{ matrix.target }}
          path: apps/cli/build/bin/${{ matrix.file }}*
          if-no-files-found: error
          retention-days: 7

      # The licence of the Node.js this executable embeds, which build:exe kept; the licences job
      # compares the targets' and the release attaches it once.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cli-node-license-${{ matrix.target }}
          path: apps/cli/build/node-license/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 7

  licences:
    name: CLI licences
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: cli-node-license-*
          path: ${{ runner.temp }}/node-licenses
          merge-multiple: true

      # LICENSE and THIRD_PARTY_LICENSES.txt of this commit and the one Node.js licence the five
      # executables share; the step fails while their texts differ (line ends aside: the Windows
      # build of Node.js ships its LICENSE with CRLF ones) and names the executables of each text.
      - name: The licences of the executables
        run: bash apps/cli/scripts/release-licenses.sh "$RUNNER_TEMP/node-licenses" "$RUNNER_TEMP/licences"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cli-licences
          path: ${{ runner.temp }}/licences/pulse-cli-*
          if-no-files-found: error
          retention-days: 7

  assets:
    name: CLI release assets
    needs: [bundle, binaries, licences]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload the release assets
      id-token: write # Sigstore certificate of the attestation
      attestations: write # store the attestation
    env:
      TAG: v${{ needs.bundle.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: cli-binary-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true

      - uses: actions/download-artifact@v8.0.2
        with:
          name: cli-licences
          path: ${{ runner.temp }}/assets

      # The checksums file is named after the CLI: the release of the tag carries every
      # artifact of the train. It lists the licences too, so the attestation covers them.
      - name: Write pulse-cli-SHA256SUMS
        working-directory: ${{ runner.temp }}/assets
        run: |
          shopt -s failglob
          files=(pulse-cli-*)
          if [ "${#files[@]}" -ne 12 ]; then
            echo "::error::Expected 5 binaries, 4 archives and 3 licences, got ${#files[@]}: ${files[*]}"
            exit 1
          fi
          sha256sum "${files[@]}" > pulse-cli-SHA256SUMS
          cat pulse-cli-SHA256SUMS

      - if: ${{ inputs.dry_run != true }}
        uses: actions/attest@v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/assets/pulse-cli-SHA256SUMS

      - name: Upload to the release
        if: ${{ inputs.dry_run != true }}
        working-directory: ${{ runner.temp }}/assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" pulse-cli-* --clobber --repo "$GITHUB_REPOSITORY"

  image:
    name: CLI image ghcr.io/miragon/pulse-cli
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout: the Dockerfile and the smoke test
      packages: write # push ghcr.io/miragon/pulse-cli
      id-token: write # Sigstore certificate of the attestation
      attestations: write # store the attestation
    env:
      IMAGE: ghcr.io/miragon/pulse-cli
      VERSION: ${{ needs.bundle.outputs.version }}
      EXPECTED_VERSION: ${{ needs.bundle.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - id: commit
        name: The commit the labels name
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8.0.2
        with:
          name: cli-standalone
          path: apps/cli/build/standalone

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build the image of this platform
        uses: docker/build-push-action@v7.4.0
        with:
          context: apps/cli
          load: true
          tags: pulse-cli:smoke

      - name: Smoke test the image
        working-directory: apps/cli
        run: bash scripts/smoke-test.sh docker run --rm -i pulse-cli:smoke

      # The action derives title, description and URL from the repository (the server's); the
      # CLI's own values override them. GHCR shows a multi-platform image's description from
      # the index annotations.
      - id: meta
        name: Tags, labels and annotations
        uses: docker/metadata-action@v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=pulse-cli
            org.opencontainers.image.description=Pulse CLI: the Camunda 7 REST API from the command line, for Operaton, CIB seven and Camunda 7
            org.opencontainers.image.url=https://miragon.github.io/pulse/cli/
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
          annotations: |
            org.opencontainers.image.title=pulse-cli
            org.opencontainers.image.description=Pulse CLI: the Camunda 7 REST API from the command line, for Operaton, CIB seven and Camunda 7
            org.opencontainers.image.url=https://miragon.github.io/pulse/cli/
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}

      - name: Log in to GHCR
        if: ${{ inputs.dry_run != true }}
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: push
        name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: apps/cli
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.dry_run != true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: ${{ inputs.dry_run != true }}
          provenance: ${{ inputs.dry_run != true && 'mode=max' || 'false' }}

      - if: ${{ inputs.dry_run != true }}
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # a storage record needs the artifact-metadata permission and is not needed here
          create-storage-record: false
