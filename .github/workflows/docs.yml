name: Docs

# The Pulse docs (docs/*.md) as a VitePress site on GitHub Pages:
# https://miragon.github.io/pulse/. A pull request that touches docs/ checks
# the vendored Miragon docs kit and builds the site (VitePress fails the build on
# a dead link). A push to main also deploys it.
# Template from Miragon/corporate-identity (skill docs-site), with the pnpm
# workspace steps: docs/ is the workspace package @miragon/pulse-docs.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# No permissions by default; each job asks for what it needs.
permissions: {}

jobs:
  build:
    name: Build the docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The full history: VitePress reads "last updated" from git.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The kit in docs/.vitepress/miragon/ and the logos in docs/public/logo/ come
      # unchanged from the corporate identity. Fails when someone edited them here.
      - name: Check the Miragon docs kit
        run: pnpm --fail-if-no-match --filter @miragon/pulse-docs check:kit

      - run: pnpm docs:build
        env:
          # Project pages are served under /<repo>/; the kit sets VitePress' base from it.
          # Taken from the repo name, so the build follows the rename in #415. The URL
          # moves with it: GitHub does not redirect project pages after a rename.
          # A build from before a rename keeps the old base and Pages serves it broken
          # under the new one, with a green run. So rename the repo first and merge
          # second, or run this workflow by hand (workflow_dispatch) right after it.
          DOCS_BASE: /${{ github.event.repository.name }}/

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deploy at a time; a queued deploy finishes instead of being cancelled.
    # Builds of pull requests never wait for it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
