name: Docker build

# Builds the server image (no push) on PRs touching what it is made of; never for Markdown.

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - LICENSE
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.base.json
      - apps/mcp-server/**
      - apps/*/package.json
      - packages/**
      - .github/workflows/docker-build.yml
      - "!**/*.md"

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - run: docker build --tag pulse-server:pr-${{ github.event.pull_request.number }} .

      # What the runtime stage copies (docs/mcp/operations.md) and Node.js's own licence, which
      # THIRD_PARTY_LICENSES.txt points to: apps/mcp-server/test/third-party-licenses.test.ts holds
      # this list to the Dockerfile.
      - name: The image ships the licences
        env:
          IMAGE: pulse-server:pr-${{ github.event.pull_request.number }}
        run: >-
          docker run --rm --entrypoint sh "$IMAGE" -c
          'test -s /usr/share/doc/pulse-server/LICENSE &&
          test -s /usr/share/doc/pulse-server/THIRD_PARTY_LICENSES.txt &&
          test -s /usr/local/LICENSE'
