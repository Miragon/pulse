name: Docker build

# Builds the server image (no push) on PRs touching what it is made of; never for Markdown.

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.base.json
      - apps/mcp-server-camunda7/**
      - apps/*/package.json
      - packages/**
      - .github/workflows/docker-build.yml
      - "!**/*.md"

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - run: docker build --tag pulse-server:pr-${{ github.event.pull_request.number }} .
