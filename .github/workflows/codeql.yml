name: CodeQL

# Scans TS/JS; Kotlin stays out (extraction is unreliable here). PRs with only prose,
# images or Gradle projects skip it; main and the weekly run analyse everything.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.gif"
      - engine-plugins/**
      - playground/cibseven-example/**
  schedule:
    - cron: "27 3 * * 1" # weekly, Monday 03:27 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: github/codeql-action/init@v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@v4.39.1
        with:
          category: "/language:javascript-typescript"
