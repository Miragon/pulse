name: Publish the Orca plugin

# Publishes Pulse for Orca (apps/orca) of a Pulse release. Orca installs a plugin from a Git
# repository, pinned to the commit of its newest version tag (`orca plugin install
# Miragon/pulse-orca`), and a catalog lists it by a release entry over that commit. So the job
# builds the plugin folder (apps/orca/dist) without credentials, checks it with the CLI of the
# Orca release CI pins, pushes it to the read-only mirror Miragon/pulse-orca, tags and releases
# the mirror commit with the Pulse release tag, and attaches the plugin folder and the catalog
# release entry (`orca plugin release-entry`) to the Pulse release. Listing the plugin in a
# catalog stays a pull request of its own, with that entry. Called by release-please.yml after
# the release gate; a manual run publishes an existing release again, or builds and checks it
# with dry-run.
on:
  workflow_call:
    inputs:
      version:
        description: Release tag (e.g. v1.2.0); the plugin must carry this version (empty on a dry run)
        required: true
        type: string
      dry_run:
        description: Build and check only, publish nothing
        type: boolean
        default: false
    secrets:
      RELEASE_PLEASE_APP_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (e.g. v1.2.0)
        required: true
        type: string
      dry_run:
        description: Build and check only, publish nothing
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

env:
  MIRROR_OWNER: Miragon
  MIRROR_NAME: pulse-orca
  # The Orca release the plugin is checked against: the pins of ci.yml's Orca job.
  ORCA_VERSION: 1.4.252
  ORCA_DEB_SHA256: f2701cb671ac5ae7cbecb51fd20c0ba17ca4530180237dd9472bd4fcb204d323

jobs:
  build:
    name: Build and check the plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - id: version
        name: The plugin is the release
        env:
          TAG: ${{ inputs.version }}
        run: |
          read_version() {
            node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version' "$1"
          }
          app="$(read_version apps/orca/package.json)"
          plugin="$(read_version apps/orca/orca-plugin.json)"
          if [ "$app" != "$plugin" ]; then
            echo "::error::apps/orca/orca-plugin.json is ${plugin}, apps/orca/package.json ${app}: is the manifest in release-please-config.json extra-files?"
            exit 1
          fi
          if [ -n "$TAG" ] && [ "v${plugin}" != "$TAG" ]; then
            echo "::error::The plugin is ${plugin}, not the release ${TAG}"
            exit 1
          fi
          echo "version=${plugin}" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo build --filter=@miragon/pulse-orca...

      - name: Orca CLI ${{ env.ORCA_VERSION }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/orca.deb" \
            "https://github.com/stablyai/orca/releases/download/v${ORCA_VERSION}/orca-ide_${ORCA_VERSION}_amd64.deb"
          echo "${ORCA_DEB_SHA256}  $RUNNER_TEMP/orca.deb" | sha256sum --check --strict
          dpkg-deb -x "$RUNNER_TEMP/orca.deb" "$RUNNER_TEMP/orca"
          echo "ORCA_RESOURCES=$RUNNER_TEMP/orca/opt/Orca/resources" >> "$GITHUB_ENV"

      - run: pnpm --fail-if-no-match --filter @miragon/pulse-orca run test:orca

      - name: The folder holds the plugin and nothing else
        run: |
          listing="$(cd apps/orca/dist && find . -type f | sort)"
          for file in ./orca-plugin.json ./worker.mjs ./panel/engines.js ./editor/index.html ./editor/board.html ./editor/bridge.js ./editor/webview.js ./assets/icon.png; do
            if ! grep -qxF "$file" <<<"$listing"; then
              echo "::error::The plugin folder lacks ${file}"
              exit 1
            fi
          done
          if grep -E '\.(map|ts|tsx)$|/node_modules/' <<<"$listing"; then
            echo "::error::The plugin folder ships sources, source maps or node_modules (listed above)"
            exit 1
          fi
          echo "$listing"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: orca-plugin
          path: apps/orca/dist/
          if-no-files-found: error
          retention-days: 7

  # Pushes the plugin folder to the mirror and tags the commit, with a token of the Miragon
  # release-please app (vars.RELEASE_PLEASE_APP_CLIENT_ID + secrets.RELEASE_PLEASE_APP_PRIVATE_KEY,
  # both organization-wide), installed on the mirror with Contents write. Runs no package manager.
  mirror:
    name: Push the mirror
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: orca-plugin
          path: ${{ runner.temp }}/plugin

      - uses: actions/create-github-app-token@v3.3.0
        id: mirror-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ env.MIRROR_OWNER }}
          repositories: ${{ env.MIRROR_NAME }}

      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.MIRROR_OWNER }}/${{ env.MIRROR_NAME }}
          token: ${{ steps.mirror-token.outputs.token }}
          path: mirror

      - name: Assemble the mirror working tree
        env:
          TAG: ${{ inputs.version }}
        run: |
          rsync -a --delete --exclude .git --exclude README.md "$RUNNER_TEMP/plugin/" mirror/
          {
            echo "# Pulse for Orca"
            echo ""
            echo "> [!NOTE]"
            echo "> Read-only mirror of the Orca plugin built from [\`apps/orca\`](https://github.com/Miragon/pulse/tree/${TAG}/apps/orca)"
            echo "> in [Miragon/pulse](https://github.com/Miragon/pulse) at ${TAG}. Open issues and pull requests there."
            echo ""
            echo "See what your process engine is running, next to your BPMN models, inside Orca:"
            echo "definitions, instances, incidents and variables of Operaton, CIB seven and Camunda 7."
            echo ""
            echo '```sh'
            echo "orca plugin install ${MIRROR_OWNER}/${MIRROR_NAME}"
            echo '```'
            echo ""
            echo "Orca asks you to approve the access the plugin needs and prints the command to do so."
            echo "The [Pulse docs](https://miragon.github.io/pulse/orca/) describe the setup."
          } > mirror/README.md

      - name: Commit, tag and release the mirror commit
        env:
          TAG: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.mirror-token.outputs.token }}
        run: |
          cd mirror
          mirror="${MIRROR_OWNER}/${MIRROR_NAME}"
          git add -A
          if git diff --cached --quiet; then
            echo "Mirror already up to date: nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync from Miragon/pulse ${TAG}"
            git push
          fi
          commit="$(git rev-parse HEAD)"
          tagged="$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | tail -n1 | cut -f1)"
          if [ -z "$tagged" ]; then
            git tag "$TAG" "$commit"
            git push origin "refs/tags/${TAG}"
          elif [ "$tagged" != "$commit" ]; then
            echo "::warning::${TAG} already tags ${tagged} on the mirror, not ${commit}: it stays where it is."
          fi
          if gh release view "$TAG" --repo "$mirror" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists on ${mirror}."
            exit 0
          fi
          gh release create "$TAG" --repo "$mirror" --verify-tag --title "$TAG" \
            --notes "Pulse for Orca as of [Miragon/pulse ${TAG}](https://github.com/Miragon/pulse/releases/tag/${TAG}); what changed is in its [changelog](https://github.com/Miragon/pulse/blob/${TAG}/CHANGELOG.md)."

  # The catalog release entry over the mirror commit, as `orca plugin release-entry` prints it
  # (Orca's own hash of the committed files), read from the public mirror without credentials.
  catalog-entry:
    name: Catalog release entry
    needs: mirror
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.MIRROR_OWNER }}/${{ env.MIRROR_NAME }}
          ref: ${{ inputs.version }}
          persist-credentials: false
          path: mirror

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Orca CLI ${{ env.ORCA_VERSION }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/orca.deb" \
            "https://github.com/stablyai/orca/releases/download/v${ORCA_VERSION}/orca-ide_${ORCA_VERSION}_amd64.deb"
          echo "${ORCA_DEB_SHA256}  $RUNNER_TEMP/orca.deb" | sha256sum --check --strict
          dpkg-deb -x "$RUNNER_TEMP/orca.deb" "$RUNNER_TEMP/orca"

      - name: Release entry
        run: |
          mkdir -p "$RUNNER_TEMP/entry"
          node "$RUNNER_TEMP/orca/opt/Orca/resources/app.asar.unpacked/out/cli/index.js" \
            plugin release-entry mirror --json > "$RUNNER_TEMP/entry/orca-catalog-entry.json"
          cat "$RUNNER_TEMP/entry/orca-catalog-entry.json"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: orca-catalog-entry
          path: ${{ runner.temp }}/entry/orca-catalog-entry.json
          if-no-files-found: error
          retention-days: 7

  # Attaches the plugin folder and the catalog entry to the Pulse release. Runs no package
  # manager and no plugin code: gh only.
  release-assets:
    name: Attach to the Pulse release
    needs: [build, catalog-entry]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: orca-plugin
          path: ${{ runner.temp }}/plugin

      - uses: actions/download-artifact@v8.0.2
        with:
          name: orca-catalog-entry
          path: ${{ runner.temp }}/entry

      - name: Upload
        env:
          TAG: ${{ inputs.version }}
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/pulse-orca-${VERSION}.tar.gz"
          tar -czf "$archive" -C "$RUNNER_TEMP/plugin" .
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$archive" "$RUNNER_TEMP/entry/orca-catalog-entry.json"
