name: Deploy Playground

# Deploys the playground stack (playground/) to Fly.io: one Fly app per
# service, see playground/fly/deploy.sh. Manual trigger only: the playground
# is a demo environment, not part of the release train.
#
# Required repo secret: FLY_API_TOKEN, an org-scoped Fly deploy token
# (`fly tokens create org -o miragon`), stored including the leading `FlyV1 `
# prefix. An app-scoped token (`fly tokens create deploy`) is rejected as
# "unauthorized": it cannot reach the other playground apps.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which app to deploy"
        type: choice
        default: all
        options:
          - all
          - engine
          - server

permissions:
  contents: read

# Never run two deploys of the shared playground environment at once.
concurrency:
  group: deploy-playground
  cancel-in-progress: false

jobs:
  # The engine Dockerfile copies the pre-built jar from build/libs. Gradle runs
  # its plugins and the build's dependencies here, where no Fly token is.
  engine-jar:
    name: Build the engine jar
    if: ${{ inputs.target == 'all' || inputs.target == 'engine' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build engine jar
        working-directory: playground/cibseven-example
        run: ./gradlew bootJar
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playground-engine-jar
          path: playground/cibseven-example/build/libs/cibseven-example.jar
          if-no-files-found: error
          retention-days: 1

  # Holds the Fly token, in the deploy step alone: runs flyctl and builds
  # nothing itself (Fly's remote builder builds the images).
  deploy:
    name: Deploy playground to Fly.io
    needs: engine-jar
    if: ${{ !cancelled() && (needs.engine-jar.result == 'success' || needs.engine-jar.result == 'skipped' && inputs.target == 'server') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.target == 'all' || inputs.target == 'engine' }}
        with:
          name: playground-engine-jar
          path: playground/cibseven-example/build/libs

      # superfly/flyctl-actions has no exact-version release tags beyond 1.5,
      # so pin by commit SHA instead (repo convention: no floating tags). The
      # flyctl binary is pinned via `version` and must be bumped manually:
      # Dependabot only updates the action SHA.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.67

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # Org that owns the playground apps (repo variable, optional).
          FLY_ORG: ${{ vars.FLY_ORG || 'miragon' }}
          TARGET: ${{ inputs.target }}
        run: ./playground/fly/deploy.sh "$TARGET"
