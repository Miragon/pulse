# Grouping rule: patch + minor updates travel together per ecosystem, major updates get
# their own pull request. A single breaking major otherwise turns the whole group red and
# blocks every harmless bump in it (see #193: mcp-use 2, TypeScript 6, ESLint 10 and 25
# more in one unmergeable PR).
version: 2
updates:
  # npm dependencies (pnpm monorepo)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # majors arrive as individual PRs: leave room next to the grouped one
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
    reviewers:
      - "dominikhorn93"
      - "emaarco"
    ignore:
      # A VS Code extension keeps its API types at its engines.vscode floor: vsce refuses a
      # package whose @types/vscode is newer than the VS Code it declares, so both move together,
      # by hand.
      - dependency-name: "@types/vscode"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    # Dependabot assigns each dependency to the FIRST group that matches it: the specific groups
    # come first, and the catch-all excludes their patterns as well.
    groups:
      # Toolkit peers `mcp-use` exactly, so bump them together in their own PR (a lone
      # bump breaks the peer + template drift gate, see #270).
      mcp-toolkit:
        patterns:
          - "mcp-use"
          - "@miragon/mcp-toolkit-*"
        update-types:
          - "patch"
          - "minor"
      # What only the CLI uses (#193: one broken bump must not hold the shared group).
      # testcontainers also runs the extension engine suites; a core package that adopts one of
      # these generic tools later gets its bumps through this group too.
      cli:
        patterns:
          - "commander"
          - "tsdown"
          - "tsx"
          - "postject"
          - "testcontainers"
          - "fast-check"
        update-types:
          - "patch"
          - "minor"
      # What only the VS Code extension uses. bpmn-js, diagram-js, playwright and @vitest/*
      # stay shared: they move in lockstep with the server and the test toolchain.
      vscode:
        patterns:
          - "preact"
          - "@vscode/*"
          - "@types/vscode"
          - "bpmn-moddle"
          - "camunda-bpmn-moddle"
          - "zeebe-bpmn-moddle"
          - "@miragon/modeler-shell"
          - "esbuild"
          - "ovsx"
          - "size-limit"
          - "@size-limit/*"
        update-types:
          - "patch"
          - "minor"
      npm-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "mcp-use"
          - "@miragon/mcp-toolkit-*"
          - "commander"
          - "tsdown"
          - "tsx"
          - "postject"
          - "testcontainers"
          - "fast-check"
          - "preact"
          - "@vscode/*"
          - "@types/vscode"
          - "bpmn-moddle"
          - "camunda-bpmn-moddle"
          - "zeebe-bpmn-moddle"
          - "@miragon/modeler-shell"
          - "esbuild"
          - "ovsx"
          - "size-limit"
          - "@size-limit/*"
        update-types:
          - "patch"
          - "minor"

  # Gradle / Kotlin plugins
  - package-ecosystem: "gradle"
    directory: "/engine-plugins"
    schedule:
      interval: "weekly"
    reviewers:
      - "dominikhorn93"
      - "emaarco"
    groups:
      gradle-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "dominikhorn93"
      - "emaarco"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # Docker images, playground: compose stack, Fly variants, engine
  - package-ecosystem: "docker"
    directories:
      - "/playground/docker"
      - "/playground/docker/otel"
      - "/playground/docker/prometheus"
      - "/playground/docker/grafana"
      - "/playground/cibseven-example"
    schedule:
      interval: "weekly"
    reviewers:
      - "dominikhorn93"
      - "emaarco"
    groups:
      docker-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # Docker image, root Dockerfile (server), keeps the pinned base digest current
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "dominikhorn93"
      - "emaarco"
    groups:
      docker-root:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # Docker image, apps/cli/Dockerfile (CLI), keeps the distroless Node.js base digest current
  - package-ecosystem: "docker"
    directory: "/apps/cli"
    schedule:
      interval: "weekly"
    reviewers:
      - "dominikhorn93"
      - "emaarco"
    groups:
      docker-cli:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
