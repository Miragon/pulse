# Grouping rule: patch + minor updates travel together per ecosystem, major updates get
# their own pull request. A single breaking major otherwise turns the whole group red and
# blocks every harmless bump in it (see #193: a framework major, TypeScript 6, ESLint 10 and
# 25 more in one unmergeable PR).
version: 2
updates:
  # npm dependencies: the pnpm monorepo and the starter template, which pins what the workspace
  # pins (scripts/template-pins.mjs, in pnpm test). One entry, so a grouped patch or minor bump
  # moves both directories. A major or a security update can arrive for one directory only: the
  # pin check then fails until the same pull request bumps the other directory by hand.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/templates/composed-server"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
    # majors arrive as individual PRs: leave room next to the grouped one
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
    reviewers:
      - "dominikhorn93"
      - "emaarco"
    ignore:
      # A VS Code extension keeps its API types at its engines.vscode floor: vsce refuses a
      # package whose @types/vscode is newer than the VS Code it declares, so both move together,
      # by hand.
      - dependency-name: "@types/vscode"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # The template's @miragon/pulse-* pins are the workspace's own version: release-please bumps
      # them with the release (extra-files), never a registry update.
      - dependency-name: "@miragon/pulse-*"
      # @types/node types the Node a package runs on: the CLI promises engines.node >=22.12.0 and
      # the VS Code extension runs on VS Code's Node 22, so their 22 types catch an API those
      # runtimes lack. A newer major would let it through; a major moves by hand, with the floor.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    # Dependabot assigns each dependency to the FIRST group that matches it: the specific groups
    # come first, and the catch-all excludes their patterns as well.
    groups:
      # The official MCP SDK (server, Node adapter, MCP Apps, client, inspector) moves as one
      # line: the inspector pins the server, client and core it was built with exactly, MCP Apps
      # and the Node adapter peer them. One PR moves the line in both directories, so the
      # template drift gate (scripts/template-pins.mjs, see #270) never sees one package or one
      # directory alone.
      mcp-sdk:
        patterns:
          - "@modelcontextprotocol/*"
        update-types:
          - "patch"
          - "minor"
      # What only the CLI uses (#193: one broken bump must not hold the shared group).
      # testcontainers also runs the extension engine suites; a core package that adopts one of
      # these generic tools later gets its bumps through this group too.
      cli:
        patterns:
          - "commander"
          - "tsdown"
          - "tsx"
          - "postject"
          - "testcontainers"
          - "fast-check"
        update-types:
          - "patch"
          - "minor"
      # What only the VS Code extension uses. bpmn-js, diagram-js, playwright and @vitest/*
      # stay shared: they move in lockstep with the server and the test toolchain.
      vscode:
        patterns:
          - "@vscode/*"
          - "@types/vscode"
          - "bpmn-moddle"
          - "camunda-bpmn-moddle"
          - "zeebe-bpmn-moddle"
          - "@miragon/modeler-shell"
          - "esbuild"
          - "ovsx"
          - "size-limit"
          - "@size-limit/*"
        update-types:
          - "patch"
          - "minor"
      npm-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@modelcontextprotocol/*"
          - "commander"
          - "tsdown"
          - "tsx"
          - "postject"
          - "testcontainers"
          - "fast-check"
          - "@vscode/*"
          - "@types/vscode"
          - "bpmn-moddle"
          - "camunda-bpmn-moddle"
          - "zeebe-bpmn-moddle"
          - "@miragon/modeler-shell"
          - "esbuild"
          - "ovsx"
          - "size-limit"
          - "@size-limit/*"
        update-types:
          - "patch"
          - "minor"

  # Gradle: the playground engine's build (playground/cibseven-example, its version catalog)
  - package-ecosystem: "gradle"
    directory: "/playground/cibseven-example"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
    reviewers:
      - "dominikhorn93"
      - "emaarco"
    groups:
      gradle-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    reviewers:
      - "dominikhorn93"
      - "emaarco"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # Compose file, the playground stack (playground/docker/docker-compose.yml): moves the images
  # it pins (the dev profile's CIB seven Run, Keycloak). dependabot-automerge-eligibility.yml
  # leaves these out (its paths name nothing under playground/docker), and no CI job starts the
  # stack: before a merge, start it on the new image (pnpm stack:up, --auth for Keycloak).
  - package-ecosystem: "docker-compose"
    directory: "/playground/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    reviewers:
      - "dominikhorn93"
      - "emaarco"
    groups:
      docker-compose-playground:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # Docker image, playground: the engine image
  - package-ecosystem: "docker"
    directories:
      - "/playground/cibseven-example"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    reviewers:
      - "dominikhorn93"
      - "emaarco"
    groups:
      docker-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # Compose file, the starter's try-out engine (templates/composed-server/compose.yaml): moves
  # its pinned CIB seven Run tag. A compose file is the docker-compose ecosystem's, not the
  # docker one's; the mirror (Miragon/pulse-starter) gets the bump with the next release.
  # The bump runs ci.yml's "Starter try-out engine" (scope starter-engine): the new image turns
  # healthy, answers an anonymous call with 401 and demo/demo with 200, deploys invoice and
  # ReviewInvoice, and a container on pulse-starter_default reaches it, the README's container
  # recipe. dependabot-automerge-eligibility.yml leaves it out (its paths name no compose file), so it
  # merges by hand once that job is green.
  - package-ecosystem: "docker-compose"
    directory: "/templates/composed-server"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    reviewers:
      - "dominikhorn93"
      - "emaarco"
    groups:
      docker-compose-template:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # Docker images, the server's Dockerfiles: the root one keeps its pinned base digest current;
  # the starter's (templates/composed-server) mirrors it with an unpinned node tag, so only a new
  # Node major reaches it, outside the group like every major
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/templates/composed-server"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    reviewers:
      - "dominikhorn93"
      - "emaarco"
    groups:
      docker-root:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # Docker image, apps/cli/Dockerfile (CLI), keeps the distroless Node.js base digest current
  - package-ecosystem: "docker"
    directory: "/apps/cli"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    reviewers:
      - "dominikhorn93"
      - "emaarco"
    groups:
      docker-cli:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
