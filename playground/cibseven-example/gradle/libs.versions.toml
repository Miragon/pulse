[versions]
# Language / platform
kotlin = "2.4.21"
# Spring Boot 4.2.0. CIB seven 3.0.0 is built on Spring Boot 4.1; 4.2.0 boots and
# serves here (engine, REST and the web app under /webapp, verified by running the
# cibseven-example app). Fallback is the 4.1.x line CIB seven builds on.
spring-boot = "4.2.0"
spring-dependency-management = "1.1.7"

# Engine SDKs
cibseven = "3.0.0"

[libraries]
# CIB seven Spring Boot starters: since 3.0.0 the suffix-less coordinates are the
# Spring Boot 4 build (Jakarta EE 11 / Spring Framework 7); the `-4` artifacts
# only relocate to them, and the starter no longer ships the legacy webapps.
cibseven-starter-rest = { module = "org.cibseven.bpm.springboot:cibseven-bpm-spring-boot-starter-rest", version.ref = "cibseven" }
cibseven-starter-webapp = { module = "org.cibseven.bpm.springboot:cibseven-bpm-spring-boot-starter-webapp", version.ref = "cibseven" }
cibseven-bpm-junit5 = { module = "org.cibseven.bpm:cibseven-bpm-junit5", version.ref = "cibseven" }
cibseven-bpm-assert = { module = "org.cibseven.bpm:cibseven-bpm-assert", version.ref = "cibseven" }

# BOM-managed (version resolved from the Spring Boot BOM, listed for discoverability)
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
h2 = { module = "com.h2database:h2" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
