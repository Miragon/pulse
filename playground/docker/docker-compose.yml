# Local demo stack: LOOPBACK-ONLY BY DESIGN. Every published port binds to
# 127.0.0.1: the engine REST API accepts anonymous requests (anyone who reaches
# it can deploy and start processes), and Keycloak uses demo-grade credentials.
# Don't drop the 127.0.0.1: prefixes to reach the stack from another machine;
# tunnel instead, e.g. `ssh -L 8400:127.0.0.1:8400 -L 8410:127.0.0.1:8410 <host>`.
name: pulse

services:
  # Default: custom-built CIB seven (../cibseven-example), seeded and with live
  # traffic; the server knows it as `prod-a`.
  cibseven:
    build:
      context: ../cibseven-example
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8410:8410"
    environment:
      - SPRING_PROFILES_ACTIVE=seed-presentation
      # Continuous real-time traffic so the cockpit moves out of the box (set
      # false to rely on the backdated seed only).
      - LIVE_TRAFFIC_ENABLED=true
    healthcheck:
      # The temurin JRE image ships no curl; probe the engine REST API with
      # bash's /dev/tcp instead (same pattern as the keycloak check below).
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8410 && printf \"GET /engine-rest/engine HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \" 200 \" <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Second engine on port 8411, `prod-b` to the server. Opt-in via the
  # `multi-engine` profile so the default `docker compose up` keeps the existing
  # single-engine setup unchanged.
  # Use: docker compose --profile multi-engine up -d
  cibseven-b:
    profiles: [multi-engine]
    build:
      context: ../cibseven-example
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8411:8410"
    environment:
      - SPRING_PROFILES_ACTIVE=seed-presentation
      - LIVE_TRAFFIC_ENABLED=true
    healthcheck:
      # The temurin JRE image ships no curl; probe the engine REST API with
      # bash's /dev/tcp instead (same pattern as the keycloak check below).
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8410 && printf \"GET /engine-rest/engine HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \" 200 \" <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Dev: CIB seven Run, the vendor's public image at an exact tag (Dependabot's docker-compose
  # entry for this file moves it); no custom build, no seed. It publishes the default
  # engine's port 8410, so it runs instead of that engine: `--profile dev up` alone starts
  # both, and the second fails to bind. Use, from the repo root with the stack down
  # (`pnpm stack:down` stops it too):
  #   docker compose -f playground/docker/docker-compose.yml --profile dev up -d cibseven-dev
  cibseven-dev:
    profiles: [dev]
    image: cibseven/cibseven:run-2.2.0
    ports:
      - "127.0.0.1:8410:8080"
    environment:
      # The REST API takes anonymous requests, like the default engine's: Run's default.yml
      # turns auth on with `authentication: pseudo`, which lets every request in, whatever its
      # credentials. So .pulse.json's `local` profile (no auth) reaches it, and so does the
      # demo/demo login .env.example sends. demo/demo is also the web app's login.
      # Without the invoice example: it sets the engine clock back while it seeds itself,
      # after the REST API already answers, so data created then gets rewound timestamps.
      # CIB seven's Run reads camunda.bpm.*, so this variable keeps the CAMUNDA_ prefix.
      - CAMUNDA_BPM_RUN_EXAMPLE_ENABLED=false
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/engine-rest/engine || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Keycloak: the local IdP for the server's opt-in OAuth
  # (MCP_OAUTH_KEYCLOAK_SERVER_URL and MCP_OAUTH_KEYCLOAK_REALM; the
  # server only validates bearer tokens; MCP clients
  # log in at Keycloak directly, by Dynamic Client Registration or with the
  # pre-registered `pulse-server` client for clients without DCR).
  # Opt-in via the `auth` profile: the plain
  # `docker compose up` stays auth-free; with the profile a locally-run
  # server reaches it on localhost:8480. `--import-realm` seeds the `miragon` realm
  # (client + demo/demo user + the `mcp-resource` audience scope that stamps
  # http://localhost:8400/mcp into aud; the server rejects tokens without it,
  # RFC 8707) from ./keycloak/realm-miragon.json on first boot. MCP clients
  # register via Dynamic Client Registration: the seeded Trusted Hosts policy
  # admits clients whose redirect URIs point at loopback (foreign hosts stay
  # rejected), and the seeded `basic` scope restores the `sub` claim the
  # server's Keycloak provider requires (a realm import with clientScopes suppresses
  # Keycloak's built-in scopes). Realm changes need a container recreate to
  # re-import (CI never boots Keycloak).
  # KC_HOSTNAME pins the issuer to the HOST url so tokens verify no
  # matter how the container is reached. Admin console: localhost:8480
  # (admin/admin, demo-grade like the rest of the stack).
  # Use: docker compose --profile auth up -d
  keycloak:
    profiles: [auth]
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=http://localhost:8480
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
    volumes:
      # No data volume ON PURPOSE: the image runs as uid 1000 and cannot chown
      # a root-owned named volume, and the realm file IS the source of truth:
      # a recreated container simply re-imports it (admin-console experiments
      # are ephemeral, like the rest of the demo stack).
      - ./keycloak/realm-miragon.json:/opt/keycloak/data/import/realm-miragon.json:ro
    ports:
      - "127.0.0.1:8480:8080"
    healthcheck:
      # The distroless-ish image ships no curl; the management port answers
      # /health/ready once the realm import finished.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # Pulse server (Node). Opt-in via the `full` profile so the
  # default `docker compose up` brings up infra only, leaving port 8400
  # free for a locally-run server (`pnpm -F @miragon/pulse-mcp-server dev`).
  # Use: docker compose --profile full up -d
  mcp-server:
    profiles: [full]
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8400:8400"
    environment:
      - PORT=8400
      # No OAuth provider and no toolset suffix ⇒ the engine module boots
      # READ-ONLY (the boot log names the effective toolsets). To exercise write
      # paths, name the toolset explicitly, e.g. add
      #   - MCP_ACTIVE_MODULES=engine:operations
      # (engine:admin for delete/modify/migrations/signals; deployments also
      # need ENGINE_ALLOW_DEPLOYMENTS=true). Safe here only because the port is
      # bound to 127.0.0.1; never widen an unauthenticated server reachable
      # from a network.
      # One engine: ENGINE_BASE_URL and its siblings below, which the
      # server makes its one profile. Several: a profile file in ENGINES_JSON
      # instead of them (the boot names each one left set as ignored), set
      # here or in a compose override file (the service passes no variable of
      # the host shell through), its secrets in ENGINE_SECRET_* variables:
      #   - 'ENGINES_JSON={"profiles":{"prod-a":{"url":"http://cibseven:8410/engine-rest","flavor":"cibseven","cockpitUrl":"http://localhost:8410/webapp","auth":{"type":"basic","username":"demo","passwordEnv":"ENGINE_SECRET_DEMO_PASSWORD"}},"prod-b":{"url":"http://cibseven-b:8410/engine-rest","flavor":"cibseven","cockpitUrl":"http://localhost:8411/webapp","auth":{"type":"basic","username":"demo","passwordEnv":"ENGINE_SECRET_DEMO_PASSWORD"}}}}'
      #   - ENGINE_SECRET_DEMO_PASSWORD=demo
      - ENGINE_BASE_URL=http://cibseven:8410/engine-rest
      # The id the server knows the engine by.
      - ENGINE_ID=prod-a
      # The engine is CIB seven: without the flavor the server takes it for
      # Camunda 7 and puts Camunda 7 routes on the /webapp cockpit below.
      - ENGINE_FLAVOR=cibseven
      - ENGINE_COCKPIT_URL=http://localhost:8410/webapp
      - ENGINE_AUTH_TYPE=basic
      - ENGINE_USERNAME=demo
      - ENGINE_PASSWORD=demo
    depends_on:
      cibseven:
        condition: service_healthy
    healthcheck:
      # Readiness over HTTP (the server's /health/ready; mirrors the Dockerfile
      # HEALTHCHECK); the image ships no curl, Node's global fetch does the probe.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8400/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
