groups:
  - name: cibseven-operations
    # Reading rules of metrics-contract.json: a gauge is an engine-wide figure
    # every node of a clustered engine reports alike, so it is read as its max
    # over the gauge's own labels before anything sums it; a counter is read
    # through the born-series count, since increase() and rate() never count a
    # series' first sample.
    rules:
      # Engine or metrics pipeline is down: no process metrics scraped.
      - alert: CibSevenEngineNoMetrics
        expr: up{job="cibseven-process-metrics"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No process metrics from the engine"
          description: "Prometheus cannot scrape process metrics (engine or OTEL Collector down) for 2m."

      # Jobs that exhausted their retries: stuck work needing manual action.
      - alert: CibSevenDeadJobs
        expr: max by (process_definition_key, engine_id) (engine_jobs_failed) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Dead jobs on {{ $labels.process_definition_key }} ({{ $labels.engine_id }})"
          description: "{{ $value }} job(s) with no retries left on {{ $labels.process_definition_key }}. Increment the retries or fix the failure."

      # WIP exists but nothing is completing: the job executor is likely stalled.
      - alert: CibSevenNoThroughput
        expr: |
          sum by (engine_id) (((increase(engine_process_instance_ended_total[15m]) and present_over_time(engine_process_instance_ended_total[1h] offset 15m)) or (max_over_time(engine_process_instance_ended_total[15m]) unless present_over_time(engine_process_instance_ended_total[1h] offset 15m)))) == 0
          and sum by (engine_id) (max by (process_definition_key, engine_id) (engine_process_instances_running)) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No process completions on {{ $labels.engine_id }} despite running instances"
          description: "Running instances exist but none have ended in 15m. The job executor may be stalled."

      # Executable job backlog piling up: the executor can't keep pace.
      - alert: CibSevenJobBacklogGrowing
        expr: max by (engine_id) (engine_jobs_executable) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Job backlog on {{ $labels.engine_id }}"
          description: "{{ $value }} executable jobs pending for 10m. The engine may be under-provisioned. (Threshold is tunable.)"

      # External tasks queued with no or slow workers consuming them.
      - alert: CibSevenExternalTaskBacklog
        expr: max by (engine_id) (engine_external_tasks_open) > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "External-task backlog on {{ $labels.engine_id }}"
          description: "{{ $value }} open external tasks for 10m. Check that the external-task workers are running."

      # Sustained open incidents.
      - alert: CibSevenOpenIncidents
        expr: sum by (engine_id, incident_type) (max by (process_definition_key, incident_type, engine_id) (engine_incidents_open)) > 0
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Open {{ $labels.incident_type }} incidents on {{ $labels.engine_id }}"
          description: "{{ $value }} open {{ $labels.incident_type }} incident(s) for 15m."

      # Human task backlog: an SLA signal.
      - alert: CibSevenUnassignedTaskBacklog
        expr: sum by (engine_id) (max by (status, engine_id) (engine_usertasks_open{status="unassigned"})) > 100
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Unassigned user-task backlog on {{ $labels.engine_id }}"
          description: "{{ $value }} unassigned user tasks for 30m. Review staffing or candidate assignment. (Threshold is tunable.)"
