# Postgres — durable user settings for the MCP server
# (wired via the server app's DATABASE_URL secret). Private-only (no
# [http_service]/[services] section, so no public IP; reachable over 6PN as
# miragon-ai-playground-postgres.internal) and always-on; data persists on a
# Fly volume (auto-created on first deploy, single machine — playground
# grade, no backups). The 18+ image keeps PGDATA in a versioned subdirectory
# of /var/lib/postgresql, so mounting the parent sidesteps the volume's
# lost+found.
#
# One-time setup before the first deploy:
#   fly secrets set POSTGRES_PASSWORD=<pw> -a miragon-ai-playground-postgres
#   fly secrets set DATABASE_URL='postgres://miragon:<pw>@miragon-ai-playground-postgres.internal:5432/miragon' -a miragon-ai-playground
app = "miragon-ai-playground-postgres"
primary_region = "fra"

[build]
  image = "postgres:18.1-alpine"

[env]
  POSTGRES_USER = "miragon"
  POSTGRES_DB = "miragon"

[[mounts]]
  source = "pg_data"
  destination = "/var/lib/postgresql"
  initial_size = "1gb"

[checks.pg]
  type = "tcp"
  port = 5432
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
