# A CIB seven engine to try the engine tools on: `docker compose up -d`, then `pnpm dev`.
# The live values of .env.example point at it (localhost:8410, cibseven, demo/demo).
#
# The engine tools only: it records no metrics and runs no Prometheus, so the analytics tools
# need the Pulse playground (https://github.com/Miragon/pulse/tree/main/playground). The
# playground's engine takes port 8410 too: run one of the two.
#
# LOOPBACK ONLY: the port binds to 127.0.0.1 and the logins are demo-grade. Don't drop the
# 127.0.0.1: prefix to reach it from another machine; tunnel instead. Its database lives in
# the container: `docker compose down` drops it, and the next `up` starts from scratch.
#
# A wrong password locks demo for a few seconds, each further one for longer (up to a minute),
# and ten in a row lock it for good: every call then answers 401, the right password too, and
# demo is the only admin who could unlock it. `docker compose down && docker compose up -d`
# resets the engine.
#
# The project name is fixed, and with it the network, pulse-starter_default: the container
# recipe in the README runs the server image on that network, where it reaches the engine as
# http://engine:8080/engine-rest on Linux, macOS and Windows alike.
name: pulse-starter

services:
  engine:
    # CIB seven Run, the vendor's public image, pinned to an exact tag.
    image: cibseven/cibseven:run-2.2.0
    ports:
      - "127.0.0.1:8410:8080"
    environment:
      # Basic auth on the REST API with the admin login demo/demo, the one .env.example sends.
      # Run's own default (authentication: pseudo) lets every request in, whatever its
      # credentials. Run reads camunda.bpm.*, so these keep the CAMUNDA_ prefix.
      - CAMUNDA_BPM_RUN_AUTH_ENABLED=true
      - CAMUNDA_BPM_RUN_AUTH_AUTHENTICATION=basic
      # The invoice example, on purpose: it deploys invoice and ReviewInvoice and starts a few
      # instances with open tasks, so the engine tools have something to show. The trade-off:
      # it seeds itself in the first seconds after the REST API answers and sets the engine
      # clock back up to 14 days meanwhile, so a write in that window gets rewound timestamps
      # (the playground's dev profile turns it off for that reason). The healthcheck can pass
      # inside that window. false starts an empty engine.
      - CAMUNDA_BPM_RUN_EXAMPLE_ENABLED=true
    healthcheck:
      # /engine-rest/engine answers without a login; the image ships curl.
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/engine-rest/engine || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
