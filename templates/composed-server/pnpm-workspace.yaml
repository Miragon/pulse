packages:
  - "server"
  - "modules/*"

# An unmet peer fails the install instead of printing a warning that scrolls by: one
# @miragon/pulse-* package or one MCP SDK package bumped alone leaves a package next to a peer it
# was never built with. server/test/pins.test.ts holds every package.json to the same line.
# Keep it on even when pnpm's hint says otherwise: a third-party peer you accept gets a
# peerDependencyRules.allowedVersions entry here, never a downgrade.
strictPeerDependencies: true
